  const legend = h('div', { class: 'ov ov-tl float legend', hidden: true }, legendToggle, legendList);
  legendToggle.addEventListener('click', () => {
    legendOpen = !legendOpen;
    renderLegend();
  });
  function renderLegend() {
    let labels = arr(state.labels);
    if (!labels.length && data) {
      const counts = new Map();
      for (const n of arr(data.nodes)) {
        const l = n.label || primaryLabel(n.labels);
        counts.set(l, (counts.get(l) || 0) + 1);
      }
      labels = [...counts].map(([label, count]) => ({ label, count }));
    }
    legend.hidden = !labels.length;
    legendToggle.setAttribute('aria-expanded', String(legendOpen));
    legendToggle.replaceChildren(h('span', null, S.entityTypes), icon(legendOpen ? 'chevUp' : 'chevDown', 14));
    legendList.hidden = !legendOpen;
    legendList.replaceChildren(...labels.map((l) => h('li', null, h('button', {
      class: 'legend-item', type: 'button', 'aria-pressed': String(typeActive === l.label),
      onclick: () => {
        typeActive = typeActive === l.label ? null : l.label;
        gv.highlightType(typeActive);
        renderLegend();
      },
    }, h('span', { class: 'dot', style: { background: labelColor(l.label) } }), h('span', { class: 'legend-name' }, l.label),
    l.count !== null ? h('span', { class: 'legend-count' }, num(l.count)) : null))));
  }

  /* search (top-centre) */
  const scope = h('select', { 'aria-label': S.searchScope },
    h('option', { value: 'all' }, S.scopeAll), h('option', { value: 'entities' }, S.scopeEntities), h('option', { value: 'facts' }, S.scopeFacts));
  const sInput = h('input', { type: 'search', placeholder: `${S.searchGraph}  (/)`, 'aria-label': S.searchGraph, autocomplete: 'off', value: state.q });
  const sResults = h('div', { class: 'gs-results', hidden: true });
  const search = h('div', { class: 'ov ov-tc float gsearch', role: 'search' }, h('div', { class: 'gs-bar' }, icon('search'), sInput, scope), sResults);
  let searchCtl = null;
  let searchSeq = 0;
  async function runSearch() {
    const q = sInput.value.trim();
    const sc = scope.value;
    const seq = ++searchSeq;
    if (searchCtl) searchCtl.abort();
    if (!q) {
      sResults.hidden = true;
      sResults.replaceChildren();
      if (state.highlight.size) setState({ highlight: new Set() });
      return;
    }
    const ents = sc === 'facts' ? [] : arr(data && data.nodes).filter((n) => String(n.name ?? '').toLowerCase().includes(q.toLowerCase())).slice(0, 20);
    const draw = (facts, note) => {
      const parts = [];
      if (sc !== 'facts') {
        parts.push(h('div', { class: 'gs-head' }, h('span', null, `${S.scopeEntities} (${ents.length})`),
          h('button', { class: 'icon-btn', type: 'button', 'aria-label': S.clearSearch, title: S.clearSearch, onclick: clearSearch }, icon('x', 14))));
        if (!ents.length) parts.push(h('div', { class: 'tl-none' }, S.noMatches));
        for (const n of ents) {
          const lab = n.label || primaryLabel(n.labels);
          parts.push(h('button', { class: 'gs-item', type: 'button', onclick: () => focusNode(n.uuid) },
            h('span', { class: 'gs-line' }, h('span', { class: 'dot', style: { background: labelColor(lab) } }), h('span', { class: 'grow' }, String(n.name ?? '')), h('span', { class: 'muted small' }, lab))));
        }
      }
      if (sc !== 'entities') {
        parts.push(h('div', { class: 'gs-head' }, h('span', null, facts ? `${S.scopeFacts} (${facts.length})` : S.scopeFacts),
          sc === 'facts' ? h('button', { class: 'icon-btn', type: 'button', 'aria-label': S.clearSearch, title: S.clearSearch, onclick: clearSearch }, icon('x', 14)) : null));
        if (note) parts.push(h('div', { class: 'gs-note' }, note));
        if (!facts) parts.push(h('div', { class: 'tl-none' }, S.searching));
        else if (!facts.length) parts.push(h('div', { class: 'tl-none' }, S.noMatches));
        else {
          const max = Math.max(...facts.map((f) => f.score || 0)) || 1;
          for (const f of facts) {
            const v = viewOf(f);
            parts.push(h('button', { class: 'gs-item', type: 'button', onclick: () => openFact(f) },
              h('span', { class: 'gs-line' }, relPill(f.relation), h('span', { class: 'grow muted small' }, `${f.source ?? ''} → ${f.target ?? ''}`), f.score !== null && f.score !== undefined ? scoreBar(f.score / max) : null),
              h('span', { class: `small ${stateStyle(v.state)}` }, f.fact ?? '')));
          }
        }
      }
      sResults.replaceChildren(...parts);
      sResults.hidden = false;
    };
    draw(sc === 'entities' ? [] : null);
    const hl = new Set(ents.map((n) => n.uuid));
    if (sc === 'entities') {
      setState({ highlight: hl });
      return;
    }
    searchCtl = new AbortController();
    try {
      const r = await api('POST', '/search', {
        body: { query: q, at: iso(state.at), as_of: iso(state.asOf), include_historical: state.history, limit: 20 },
        signal: searchCtl.signal, quiet: true,
      });
      if (seq !== searchSeq) return;
      const facts = arr(r.facts);
      cacheFacts(facts);
      for (const f of facts) hl.add(f.uuid);
      draw(facts, r.degraded ? S.degraded : null);
      setState({ highlight: hl });
    } catch (e) {
      if (isAbort(e) || seq !== searchSeq) return;
      draw([], e.message);
    }
  }
  const searchSoon = debounce(() => { setState({ q: sInput.value.trim() }); runSearch(); }, 300);
  sInput.addEventListener('input', searchSoon);
  sInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); searchSoon.cancel(); setState({ q: sInput.value.trim() }); runSearch(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); clearSearch(); sInput.blur(); }
    else if (ev.key === 'ArrowDown') {
      const first = sResults.querySelector('.gs-item');
      if (first) { ev.preventDefault(); first.focus(); }
    }
  });
  sResults.addEventListener('keydown', (ev) => {
    const items = [...sResults.querySelectorAll('.gs-item')];
    const i = items.indexOf(document.activeElement);
    if (ev.key === 'ArrowDown' && i >= 0) { ev.preventDefault(); (items[i + 1] || items[i]).focus(); }
    else if (ev.key === 'ArrowUp' && i >= 0) { ev.preventDefault(); (i ? items[i - 1] : sInput).focus(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); sInput.focus(); }
  });
  scope.addEventListener('change', () => runSearch());
  sInput.addEventListener('focus', () => { if (sInput.value.trim() && sResults.childElementCount) sResults.hidden = false; });
  function clearSearch() {
    searchSoon.cancel();
    sInput.value = '';
    setState({ q: '' });
    runSearch();
  }
  function focusNode(id) {
    select('node', id);
    gv.select(state.sel);
    gv.centerOn(id);
  }
  function openFact(f) {
    select('edge', f.uuid, f);
    if (gv.has('edge', f.uuid)) gv.select(state.sel, { zoom: true });
  }

  /* counters (top-right), zoom (bottom-left), expand (bottom-right), empty state, highlight chip */
  const counters = h('div', { class: 'ov ov-tr float counters', 'aria-live': 'polite' });
  const zoom = h('div', { class: 'ov ov-bl float zoom' },
    h('button', { class: 'btn btn-ghost btn-sm btn-icon', type: 'button', 'aria-label': S.zoomIn, title: S.zoomIn, onclick: () => gv.zoomBy(1.25) }, icon('plus', 14)),
    h('button', { class: 'btn btn-ghost btn-sm btn-icon', type: 'button', 'aria-label': S.zoomOut, title: S.zoomOut, onclick: () => gv.zoomBy(0.8) }, icon('minus', 14)),
    h('button', { class: 'btn btn-ghost btn-sm', type: 'button', title: S.fitTip, onclick: () => gv.fitAll() }, icon('fit', 14), S.fit));
  let expanded = false;
  const expandBtn = h('button', { class: 'btn btn-sm ov ov-br', type: 'button', 'aria-pressed': 'false' });
  const renderExpand = () => {
    stats.hidden = expanded;
    expandBtn.setAttribute('aria-pressed', String(expanded));
    expandBtn.replaceChildren(icon(expanded ? 'shrink' : 'expand', 14), expanded ? S.collapse : S.expand);
  };
  expandBtn.addEventListener('click', () => { expanded = !expanded; renderExpand(); });
  renderExpand();
  const empty = h('div', { class: 'ov float graph-empty', hidden: true });
  const hlChip = h('div', { class: 'ov float hl-chip', hidden: true });
  card.append(legend, search, counters, zoom, expandBtn, empty, hlChip);

  function renderCounters() {
    if (!data) return counters.replaceChildren();
    const c = data.counts || {};
    const nodes = arr(data.nodes).length;
    const edges = arr(data.edges).length;
    fill(counters, h('span', null, S.counters(num(nodes), num(edges), num(c.facts ?? edges))),
      data.truncated ? badge(S.truncated, 'amber-o', S.truncatedTip) : null);
  }
  function renderEmpty() {
    const none = !!data && !arr(data.edges).length;
    empty.hidden = !none;
    if (!none) return;
    // isolated nodes may still be drawn in the middle: keep the message out of their way
    empty.classList.toggle('low', arr(data.nodes).length > 0);
    const noFactsAtAll = data.counts && data.counts.facts === 0;
    const add = canWrite(state.group) ? h('button', { class: 'btn btn-primary btn-sm', type: 'button', onclick: () => openAddMemory() }, icon('plus', 14), S.addMemory) : null;
    empty.replaceChildren(...(state.history || noFactsAtAll
      ? [h('h3', null, S.emptyAll), h('p', null, S.emptyAllText), h('div', { class: 'row' }, add)]
      : [h('h3', null, S.emptyNow), h('p', null, S.emptyNowText), h('div', { class: 'row' },
        h('button', { class: 'btn btn-sm', type: 'button', onclick: () => setState({ history: true }) }, S.showHistory), add)]));
  }
  function clearHighlight() {
    setState({ highlight: new Set() });
  }
  function renderHighlight() {
    gv.highlight(state.highlight);
    const n = state.highlight.size;
    hlChip.hidden = !n || !!sInput.value.trim();
    if (n) hlChip.replaceChildren(h('span', null, S.highlighting(n)), h('button', { class: 'btn btn-sm btn-ghost', type: 'button', onclick: clearHighlight }, S.clear));
  }

  /* data */
  async function loadGraph() {
    if (loadCtl) loadCtl.abort();
    loadCtl = new AbortController();
    const signal = loadCtl.signal;
    const key = timeKey();
    card.classList.add('busy');
    try {
      const r = await api('GET', '/graph', {
        query: { at: iso(state.at), as_of: iso(state.asOf), history: state.history ? 'true' : undefined, isolated: 'true', limit: 500 },
        signal, quiet: true,
      });
      const edges = arr(r.edges);
      tagRows(edges, key);
      cacheFacts(edges);
      applyGroupMeta(r);
      data = { ...r, nodes: arr(r.nodes), edges };
      const err = card.querySelector('.graph-error');
      if (err) err.remove();
      gv.setData({ nodes: data.nodes, edges, history: state.history });
      renderLegend();
      renderCounters();
      renderEmpty();
      renderHighlight();
      if (firstData) {
        firstData = false;
        const sel = state.sel;
        gv.select(sel);
        // a selection restored from the URL is framed once the first layout settles
        if (sel && (sel.kind === 'node' || sel.kind === 'edge') && gv.has(sel.kind, sel.id)) gv.focusWhenSettled(sel);
        else if (state.highlight.size) gv.focusWhenSettled({ kind: 'set', ids: [...state.highlight] });
        if (sInput.value.trim()) runSearch();
      } else {
        gv.select(state.sel);
        if (sInput.value.trim()) runSearch(); // results depend on the instant
      }
    } catch (e) {
      if (isAbort(e)) return;
      if (!data) {
        const old = card.querySelector('.graph-error');
        if (old) old.remove();
        const box = h('div', { class: 'ov float graph-empty graph-error' }, errorState(e, loadGraph));
        box.querySelector('h3').textContent = S.graphFailed;
        card.append(box);
      } else toast(e.message, 'error');
    } finally {
      if (!signal.aborted) card.classList.remove('busy');
    }
  }
  async function loadStats() {
    clearTimeout(statsTimer);
    let busy = false;
    try {
      const s = await api('GET', '/stats', { quiet: true });
      if (destroyed) return;
      const ep = s.episodes || {};
      const f = s.facts || {};
      const j = s.jobs || {};
      busy = (j.queued || 0) + (j.running || 0) > 0 || (ep.pending || 0) > 0;
      stats.replaceChildren(
        statCard(S.statEntities, num(s.entities), S.statsNow),
        statCard(S.statFacts, num(f.total), S.statFactsSub(num(f.active), num(f.historical))),
        statCard(S.statEpisodes, num(ep.total), h('span', null, S.statEpisodesSub(num(ep.processed), num(ep.pending)),
          h('span', { class: ep.failed ? 'txt-red' : null }, S.statFailed(num(ep.failed)))),
        ep.failed && canWrite(state.group) ? h('button', { class: 'link small', type: 'button', onclick: (ev) => retryFailed(ev.currentTarget) }, S.retryFailed) : null),
        statCard(S.statJobs, num((j.queued || 0) + (j.running || 0)), S.statJobsSub(num(j.queued || 0), num(j.running || 0))));
      // someone else (an MCP client, a job) changed the graph: refresh it
      const sig = `${s.entities}|${f.total}|${f.active}|${f.historical}`;
      if (statsSig && sig !== statsSig) loadGraph();
      statsSig = sig;
    } catch (e) {
      if (destroyed) return;
      stats.replaceChildren(statCard(S.statFacts, '—', e.message));
    }
    if (!destroyed) statsTimer = setTimeout(loadStats, busy ? 3000 : 30000);
  }
  loadGraph();
  loadStats();
  return {
    destroy() {
      destroyed = true;
      if (loadCtl) loadCtl.abort();
      if (searchCtl) searchCtl.abort();
      searchSoon.cancel();
      clearTimeout(statsTimer);
      gv.destroy();
    },
    reload: loadGraph,
    onData() { loadGraph(); loadStats(); },
    onSel() { gv.select(state.sel, { zoom: !!state.sel && state.sel.kind === 'node' }); },
    onHighlight: renderHighlight,
    onMeta: renderLegend,
    onQuery() {
      if (sInput.value.trim() !== state.q) {
        sInput.value = state.q;
        runSearch();
      }
    },
    fit: () => gv.fitAll(),
    focusSearch: () => { sInput.focus(); sInput.select(); },
    focusNode(id) { focusNode(id); },
    focusHighlight() { gv.fitSet([...state.highlight]); },
  };
}

/* ---- 8.3 facts ---------------------------------------------------------- */
function FactsView(root) {
  root.classList.add('fill');
  let ctl = null;
  let rows = [];
  let kind = 'browse';
  let relFilter = '';
  const modeSeg = segmented([{ value: '', label: S.modeSearch }, { value: 'about', label: S.modeAbout }], state.mode,
    (v) => { if (v !== state.mode) setState({ mode: v, q: '' }, 'push'); }, S.factsModes);
  const input = h('input', { class: 'input grow', type: 'search', value: state.q, style: { 'max-width': '440px' } });
  const relSel = h('select', { class: 'input', 'aria-label': S.filterRelation });
  relSel.addEventListener('change', () => { relFilter = relSel.value; draw(); });
  const showBtn = h('button', { class: 'btn', type: 'button', onclick: showAll }, icon('graph'), S.showAllOnGraph);
  const notesEl = h('span', { class: 'row', style: { 'flex-wrap': 'wrap' } });
  const countEl = h('span', { style: { 'margin-left': 'auto' } });
  const info = h('div', { class: 'info' }, notesEl, countEl);
  let body = h('div', { class: 'table-wrap' }, skeletonRows(6));
  const setBody = (el) => { body.replaceWith(el); body = el; };
  root.append(h('div', { class: 'toolbar' }, modeSeg.el, input, relSel, h('span', { class: 'grow' }), showBtn), info, body);
  const setQ = debounce(() => setState({ q: input.value.trim() }), 350);
  input.addEventListener('input', setQ);
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); setQ.cancel(); setState({ q: input.value.trim() }); }
  });

  function showAll() {
    const list = visible();
    setState({ highlight: new Set(list.map((f) => f.uuid)) });
    go('graph');
  }
  function visible() {
    return kind === 'browse' && relFilter ? rows.filter((r) => r.relation === relFilter) : rows;
  }
  async function load() {
    if (ctl) ctl.abort();
    ctl = new AbortController();
    const signal = ctl.signal;
    const key = timeKey();
    const q = state.q;
    const about = state.mode === 'about';
    modeSeg.set(state.mode);
    input.placeholder = about ? S.aboutPh : S.searchFactsPh;
    input.setAttribute('aria-label', about ? S.modeAbout : S.modeSearch);
    const common = { at: iso(state.at), as_of: iso(state.asOf) };
    if (!body.querySelector('table')) setBody(h('div', { class: 'table-wrap' }, skeletonRows(6)));
    else body.classList.add('busy');
    try {
      const notes = [];
      if (about) {
        kind = 'about';
        if (!q) {
          rows = [];
          notesEl.replaceChildren(h('span', null, S.aboutPrompt));
          draw();
          return;
        }
        let r;
        try {
          r = await api('GET', `/entities/${encodeURIComponent(q)}/facts`, {
            query: { ...common, include_historical: state.history ? 'true' : undefined, limit: 100 }, signal, quiet: true,
          });
        } catch (e) {
          if (e.status !== 404) throw e;
          rows = [];
          notesEl.replaceChildren(h('span', null, S.noEntityMatches(q)));
          draw();
          return;
        }
        rows = arr(r.facts);
        if (r.entity) {
          const lab = primaryLabel(r.entity.labels);
          notes.push(h('button', { class: 'chip', type: 'button', style: { cursor: 'pointer' }, onclick: () => select('node', r.entity.uuid) },
            h('span', { class: 'dot', style: { background: labelColor(lab) } }), String(r.entity.name ?? '')));
        }
        const cands = arr(r.candidates);
        if (cands.length) {
          notes.push(h('span', null, S.alsoMatches));
          cands.forEach((c, i) => {
            if (i) notes.push(h('span', { 'aria-hidden': 'true' }, '·'));
            notes.push(h('button', { class: 'link', type: 'button', onclick: () => { input.value = c.name; setState({ q: String(c.name ?? '') }); } }, String(c.name ?? '')));
          });
        }
      } else if (q) {
        kind = 'search';
        const r = await api('POST', '/search', {
          body: { query: q, ...common, include_historical: state.history, limit: 50 }, signal, quiet: true,
        });
        rows = arr(r.facts);
        if (r.degraded) notes.push(badge(S.degraded, 'amber-o'));
      } else {
        kind = 'browse';
        const r = await api('GET', '/graph', {
          query: { ...common, history: state.history ? 'true' : undefined, limit: 1000 }, signal, quiet: true,
        });
        applyGroupMeta(r);
        rows = arr(r.edges).slice().sort((a, b) => (ms(b.created_at) ?? 0) - (ms(a.created_at) ?? 0));
        tagRows(rows, key);
        if (r.truncated) notes.push(badge(S.truncated, 'amber-o', S.truncatedTip));
      }
      cacheFacts(rows);
      notesEl.replaceChildren(...notes);
      draw();
    } catch (e) {
      if (isAbort(e)) return;
      notesEl.replaceChildren();
      countEl.textContent = '';
      setBody(h('div', { class: 'table-wrap' }, errorState(e, load)));
    } finally {
      if (!signal.aborted) body.classList.remove('busy');
    }
  }
  function draw() {
    // relation filter (browse mode only)
    relSel.hidden = kind !== 'browse';
    if (kind === 'browse') {
      const rels = [...new Set(rows.map((r) => r.relation).filter(Boolean))].sort();
      if (relFilter && !rels.includes(relFilter)) relFilter = '';
      relSel.replaceChildren(h('option', { value: '' }, S.allRelations), ...rels.map((r) => h('option', { value: r }, r)));
      relSel.value = relFilter;
    }
    const list = visible();
    showBtn.disabled = !list.length;
    const max = Math.max(0, ...list.map((f) => f.score || 0)) || 1;
    const columns = [
      { key: 'fact', label: S.colFact, cls: 'fact-cell', render: (f) => h('span', { class: stateStyle(viewOf(f).state) }, f.fact ?? '') },
      { key: 'relation', label: S.colRelation, sortValue: (f) => f.relation || '', render: (f) => relPill(f.relation) },
      { key: 'ends', label: S.colEnds, render: endpoints },
      { key: 'validity', label: S.colValidity, render: (f) => { const v = viewOf(f); return h('div', { class: 'validity' }, h('span', { class: 'badges' }, badges(f, v)), h('span', { class: 'muted small' }, rangeText(f, v))); } },
      { key: 'learned', label: S.colLearned, cls: 'nowrap', firstDir: 'desc', sortValue: (f) => ms(f.created_at), render: (f) => h('span', { title: fmtDateTime(ms(f.created_at)) }, relTime(ms(f.created_at))) },

function EpisodesView(root) {
  root.classList.add('fill');

  const retryBtn = h('button', { class: 'btn', type: 'button', onclick: (ev) => retryFailed(ev.currentTarget) });
  const note = h('span', { class: 'muted small' });

  root.append(h('div', { class: 'toolbar' }, statusChips.el, sourceChips.el, h('span', { class: 'grow' }), note, retryBtn), body);
  async function load() {
    clearTimeout(timer);
    if (ctl) ctl.abort();
    ctl = new AbortController();
    try {
      const r = await api('GET', '/episodes', { query: { limit: 100 }, signal: ctl.signal, quiet: true });
      rows = arr(r.episodes);
      loaded = true;
      draw();

    }
  }

    if (!loaded) return;

    const known = rows.filter((e) => (ms(e.created_at) ?? 0) <= asOf);
    const hidden = rows.length - known.length;

    statusChips.render([

      { value: 'processed', label: S.stProcessed, count: count((e) => (e.status || 'processed') === 'processed') },

    const table = dataTable({
      label: S.views.episodes,

      onRow: (e) => select('episode', e.uuid),

      columns: [

          render: (e) => h('span', { class: 'row' }, statusDot(e.status), h('span', { class: 'small' }, S.epStatus[e.status || 'processed'] || e.status)) },
        { key: 'name', label: S.colName, sortValue: (e) => String(e.name ?? '').toLowerCase(), render: (e) => h('strong', null, trunc(e.name || e.content, 80)) },
        { key: 'source', label: S.colSource, sortValue: (e) => e.source || '', render: (e) => pill(e.source || 'text') },
        { key: 'desc', label: S.colSourceDesc, render: (e) => h('span', { class: 'muted' }, trunc(e.source_description, 60)) },
        { key: 'happened', label: S.colHappened, cls: 'nowrap', firstDir: 'desc', sortValue: (e) => ms(e.valid_at),
          render: (e) => h('span', { title: fmtDateTime(ms(e.valid_at)) }, fmtDay(ms(e.valid_at))) },
        { key: 'ingested', label: S.colIngested, cls: 'nowrap', firstDir: 'desc', sortValue: (e) => ms(e.created_at),

    body.replaceWith(table);

  }
  load();

    destroy() { clearTimeout(timer); if (ctl) ctl.abort(); },

    onTime: draw,
  };

/** A fact by uuid: from any row seen so far, else from the graph with history. */
async function findFact(id, signal) {
  if (factCache.has(id)) return factCache.get(id);
  for (const [k, v] of factCache) if (id.length >= 8 && k.startsWith(id)) return v;
  const r = await api('GET', '/graph', { query: { history: 'true', limit: 2000 }, signal, quiet: true });
  const edges = arr(r.edges);
  tagRows(edges, 'null|null');
  cacheFacts(edges);
  const f = edges.find((e) => e.uuid === id || (id.length >= 8 && e.uuid.startsWith(id)));
  if (!f) throw new ApiError(404, S.factMissing);
  return f;
}
function miniBar(f, v) {
  const W = 240;
  const H = 30;
  const P = 6;
  const at = atNow();
  const valid = ms(f.valid_at);
  const end = v.endsAt;
  const vals = [at, valid, end].filter((x) => x !== null);
  let lo = Math.min(...vals);
  let hi = Math.max(...vals);
  const span = Math.max(hi - lo, 60 * DAY);
  lo -= span * 0.2;
  hi += span * 0.2;
  const X = (t) => P + ((t - lo) / (hi - lo)) * (W - 2 * P);
  const kids = [sv('line', { class: 'mb-base', x1: P, x2: W - P, y1: 12, y2: 12 })];
  if (v.state !== 'retracted') {
    const x0 = valid !== null ? X(valid) : P;
    const x1 = end !== null ? X(end) : W - P;
    kids.push(sv('rect', { class: `mb-win s-${v.state}`, x: x0, y: 7, width: Math.max(2, x1 - x0), height: 10, rx: 3 }));
  }
  const cx = X(at);
  kids.push(sv('line', { class: 'mb-cursor', x1: cx, x2: cx, y1: 2, y2: 22 }));
  kids.push(sv('text', { x: clamp(cx, 16, W - 16), y: 29, 'text-anchor': 'middle' }, state.at === null ? S.nowWord : fmtDay(state.at)));
  return sv('svg', { class: 'minibar', viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': rangeText(f, v) }, ...kids);
}

          { key: 'role', label: S.colRole, firstDir: 'desc', sortValue: (m) => rank(m.role),
            render: (m) => (editable(m) ? roleSelect(m.role, (v, sel) => setRole(m, v, sel), S.roleFor(m.user)) : roleBadge(m.role)) },
          { key: 'grant', label: S.colGrant,
            render: (m) => (exact(m) ? h('span', { class: 'muted' }, S.exactGrant) : h('span', { class: 'muted', title: S.patternTip }, S.viaPattern(m.pattern))) },
          { key: 'added', label: S.colAdded, cls: 'nowrap', firstDir: 'desc', sortValue: (m) => ms(m.created_at),
            render: (m) => h('span', { title: fmtDateTime(ms(m.created_at)) }, relTime(ms(m.created_at))) },
          { key: 'act', label: h('span', { class: 'sr-only' }, S.actions), cls: 'act',
            render: (m) => (editable(m)
              ? h('button', { class: 'btn btn-sm btn-danger', type: 'button', onclick: () => remove(m) }, S.remove)
              : exact(m) ? h('span', { class: 'muted small', title: S.selfTip }, S.selfNote) : null) },
        ],
      }));
    } catch (e) {
      if (isAbort(e) || destroyed) return;
      body.replaceChildren(h('div', { class: 'card' }, e.status === 403 ? emptyState({ title: S.membersForbidden, text: e.message }) : errorState(e, load)));
    }
  }
  load();
  return {
    destroy() { destroyed = true; ctl.abort(); },
    reload: load,
    onTime() { /* members have no time */ },
    onData() { /* nor do memories change them */ },
    onAccess: load,
    focusSearch: () => userIn.focus(),
  };
}

/* ---- 8.12 access page: my account, my tokens, users (admins) ------------ */
function AccessView(root) {
  const ctl = new AbortController();
  let destroyed = false;
  const me = session.me;
  const wrap = h('div', { class: 'acc' });
  root.append(h('div', { class: 'page-head' }, h('div', null, h('h1', null, S.access), h('p', { class: 'muted small' }, S.accessSub))), wrap);
  const card = (title, action, ...content) => h('section', { class: 'card acc-card' }, h('div', { class: 'acc-head' }, h('h2', null, title), action), ...content);
  if (!me || session.mode !== 'login') {
    wrap.append(card(S.myAccount, null, h('p', { class: 'muted' }, S.noLoginNote), me ? grantChips(me.grants) : null));
    return { destroy() { destroyed = true; } };
  }

  /* my account */
  const tok = me.token || {};
  const dg = me.default_group;
  wrap.append(card(S.myAccount, null, h('dl', { class: 'kv' },
    h('dt', null, S.fUser),
    h('dd', null, me.user
      ? h('span', { class: 'row', style: { 'flex-wrap': 'wrap' } }, h('strong', null, me.user.name),
        me.admin ? badge(S.adminBadge, 'accent') : me.user.admin ? badge(S.adminNarrowed, 'slate', S.adminNarrowedTip) : null)
      : h('span', { class: 'muted' }, S.noAccount)),
    h('dt', null, S.fLoggedInWith),
    h('dd', null, h('span', { class: 'row', style: { 'flex-wrap': 'wrap' } },
      h('span', null, me.user ? tok.name || S.unnamed : S.envTokenKind), h('code', null, tok.id || ''),
      tok.expires_at ? h('span', { class: 'muted small' }, S.expiresOn(fmtDay(ms(tok.expires_at)))) : null)),
    h('dt', null, S.fDefaultGroup),
    h('dd', null, dg ? h('a', { href: hrefFor('graph', dg) }, dg) : '—'),
    h('dt', null, S.fGrants),
    h('dd', null, grantChips(me.grants), h('p', { class: 'help', style: { 'margin-top': '6px' } }, me.user ? S.grantsHelp : S.envGrantsHelp)))));

  /* my tokens */
  const tokensBody = h('div', null, skeletonRows(3));
  if (me.user) {
    const newBtn = h('button', { class: 'btn btn-primary btn-sm', type: 'button', onclick: newMine }, icon('plus', 14), S.newToken);
    wrap.append(card(S.myTokens, newBtn, h('p', { class: 'muted small' }, S.tokensHelp), tokensBody));
  } else {
    wrap.append(card(S.myTokens, null, h('p', { class: 'muted' }, S.envTokenNote)));
  }
  function newMine() {
    openTokenDialog({
      title: S.newToken, nameRequired: true,
      create: (body) => api('POST', '/me/tokens', { group: null, quiet: true, body }),
      onCreated: () => loadTokens(),
    });
  }
  function revokeMine(t) {
    const own = t.id === tok.id;
    confirmDialog({
      title: S.revokeToken, text: S.revokeTokenText(t.name || t.prefix) + (own ? S.revokeOwnNote : ''), confirmLabel: S.revoke,
      run: () => api('POST', `/me/tokens/${enc(t.id)}/revoke`, { group: null, quiet: true }),
    }).then((ok) => {
      if (!ok) return;
      toast(S.tokenRevoked, 'ok');
      loadTokens(); // the own token: this answers 401, and the login takes over
    });
  }
  async function loadTokens() {
    if (!me.user) return;
    try {
      const r = await api('GET', '/me/tokens', { group: null, signal: ctl.signal, quiet: true });
      if (destroyed) return;
      tokensBody.replaceChildren(tokenTable(r.tokens, { label: S.myTokens, currentId: tok.id, onRevoke: revokeMine }));
    } catch (e) {
      if (isAbort(e) || destroyed) return;
      tokensBody.replaceChildren(e.status === 403 ? h('p', { class: 'muted' }, S.envTokenNote) : errorState(e, loadTokens));
    }
  }

  /* users (admins) */
  const usersBody = h('div', null, skeletonRows(4));
  if (me.admin) {
    const newBtn = h('button', { class: 'btn btn-primary btn-sm', type: 'button', onclick: () => openCreateUser() }, icon('plus', 14), S.newUser);
    wrap.append(card(S.users, newBtn, h('p', { class: 'muted small' }, S.usersHelp), usersBody));
  }
  async function loadUsers() {
    if (!me.admin) return;
    try {
      const r = await api('GET', '/admin/users', { group: null, signal: ctl.signal, quiet: true });
      if (destroyed) return;
      const self = selfName();
      usersBody.replaceChildren(dataTable({
        label: S.users,
        rows: arr(r.users),
        sort: { key: 'name', dir: 'asc' },
        onRow: (u) => openUserDialog(u.name),
        rowClass: (u) => (u.disabled ? 'dim-row' : null),
        empty: emptyState({ title: S.noUsers }),
        columns: [
          { key: 'name', label: S.colName, sortValue: (u) => String(u.name),
            render: (u) => h('span', { class: 'row' }, h('strong', null, u.name), u.name === self ? pill(S.you) : null) },
          { key: 'admin', label: S.colAdmin, sortValue: (u) => (u.admin ? 0 : 1), render: (u) => (u.admin ? badge(S.adminBadge, 'accent') : h('span', { class: 'muted' }, '—')) },
          { key: 'state', label: S.colStatus, sortValue: (u) => (u.disabled ? 1 : 0),
            render: (u) => (u.disabled ? badge(S.disabledBadge, 'red') : badge(S.activeBadge, 'green')) },
          { key: 'default', label: S.colDefault, sortValue: (u) => String(u.default_group || ''),
            render: (u) => (u.default_group ? h('code', null, u.default_group) : h('span', { class: 'muted' }, '—')) },
          { key: 'grants', label: S.colGrants, render: (u) => grantChips(u.grants, 4) },
          { key: 'tokens', label: S.colActiveTokens, cls: 'num', firstDir: 'desc', sortValue: activeTokens, render: (u) => num(activeTokens(u)) },
          { key: 'act', label: h('span', { class: 'sr-only' }, S.actions), cls: 'act',
            render: (u) => h('button', { class: 'btn btn-sm', type: 'button', onclick: () => openUserDialog(u.name) }, S.manage) },
        ],
      }));
    } catch (e) {
      if (isAbort(e) || destroyed) return;
      usersBody.replaceChildren(errorState(e, loadUsers));
    }
  }
  const reload = () => { loadTokens(); loadUsers(); };
  reload();
  return {
    destroy() { destroyed = true; ctl.abort(); },
    reload,
    onTime() { /* nothing here depends on the time control */ },
    onData() { /* nor on memories */ },
    onAccess: reload,
  };
}

/** Admins: a new user, by default with a workspace; then its first token, once. */
function openCreateUser() {
  const name = h('input', { class: 'input', maxlength: 64, required: true, autocomplete: 'off', spellcheck: 'false', autocapitalize: 'off' });
  const dg = h('input', { class: 'input', placeholder: S.defaultGroupPh, autocomplete: 'off', spellcheck: 'false' });
  const admin = h('input', { type: 'checkbox' });
  const ws = h('input', { type: 'checkbox', checked: true });
  const wsHelp = h('div', { class: 'help' }, S.workspaceHelp(''));
  // the workspace follows the default group, which is the name unless given
  const syncWs = () => { wsHelp.textContent = S.workspaceHelp(dg.value.trim() || name.value.trim()); };
  name.addEventListener('input', syncWs);
  dg.addEventListener('input', syncWs);
  const body = h('div', { class: 'form' },
    field(S.fName, name, h('div', { class: 'help' }, S.userNameHelp)),
    field(`${S.fDefaultGroup} (${S.optional})`, dg),
    h('div', { class: 'field' }, h('label', { class: 'switch' }, ws, h('span', null, S.fWorkspace)), wsHelp),
    h('label', { class: 'switch' }, admin, h('span', null, S.fAdmin)));
  const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, S.createUser);
  const d = openDialog({
    title: S.newUser, body, wide: true,
    actions: [h('button', { class: 'btn', type: 'button', onclick: () => d.close() }, S.cancel), submit],
    onSubmit: async () => {
      const n = name.value.trim();
      if (!USER_NAME.test(n)) { d.setError(S.badUserName); name.focus(); return; }
      const b = { name: n, admin: admin.checked, workspace: ws.checked };
      if (dg.value.trim()) b.default_group = dg.value.trim();
      d.setError('');
      d.setBusy(true);
      try {
        const r = await api('POST', '/admin/users', { group: null, quiet: true, body: b });
        toast(S.userCreated(n), 'ok');
        emitAccess();
        showSecretIn(d, S.userCreated(n), String(r.token ?? ''), S.firstTokenLead(n));
      } catch (e) {
        d.setError(e.message);
      } finally {
        d.setBusy(false);
      }
    },
  });
  name.focus();
}

/**
 * Admins: one user. Enable / disable, admin or not, default group, grants
 * (add, change the role, revoke) and tokens (create, revoke); each change
 * applies at once and the dialog shows the user as the server has it now.
 */
function openUserDialog(name) {
  const box = h('div', { class: 'form' }, skeletonRows(4));
  const d = openDialog({
    title: S.userTitle(name), body: box, xl: true,
    actions: [h('button', { class: 'btn btn-primary', type: 'button', onclick: () => d.close() }, S.done)],
  });
  let user = null;
  const isSelf = () => name === selfName();
  const userPath = `/admin/users/${enc(name)}`;
  const post = (path, body) => api('POST', path, { group: null, quiet: true, body });
  async function load() {
    try {
      const r = await api('GET', '/admin/users', { group: null, quiet: true });
      user = arr(r.users).find((u) => u.name === name) || null;
      if (d.dlg.open) render();
    } catch (e) {
      if (d.dlg.open) d.setError(e.message);
    }
  }
  /** Runs one change (asking first when `confirm` is given), then reloads the user. */
  async function change(run, okMsg, confirm) {
    d.setError('');
    if (confirm) {
      if (!(await confirmDialog({ ...confirm, run }))) return;
    } else {
      try {
        await run();
      } catch (e) {
        render(); // put back what a failed select shows
        d.setError(e.message);
        return;
      }
    }
    toast(okMsg, 'ok');
    if (isSelf()) {
      await refreshMe();
      // no longer an admin (or logged out): this dialog has nothing left to show
      if (!session.me || !session.me.admin) return d.close();
    }
    emitAccess();
    if (d.dlg.open) await load();
  }
  function render() {
    // keep the keyboard where it was across the re-render
    const active = box.contains(document.activeElement) ? document.activeElement.dataset.k : undefined;
    const u = user;
    if (!u) {
      fill(box, emptyState({ title: S.noSuchUser }));
      return;
    }
    const self = isSelf();
    const adminBtn = h('button', { class: 'btn btn-sm', type: 'button', dataset: { k: 'admin' },
      onclick: () => change(() => post(userPath, { admin: !u.admin }), S.userUpdated, {
        title: u.admin ? S.removeAdmin : S.makeAdmin,
        text: u.admin ? S.removeAdminText(u.name, self) : S.makeAdminText(u.name),
        confirmLabel: u.admin ? S.removeAdmin : S.makeAdmin,
        danger: u.admin,
      }) }, u.admin ? S.removeAdmin : S.makeAdmin);
    const stateBtn = u.disabled
      ? h('button', { class: 'btn btn-sm', type: 'button', dataset: { k: 'state' }, onclick: () => change(() => post(userPath, { disabled: false }), S.userUpdated) }, S.enableUser)
      : h('button', { class: 'btn btn-sm btn-danger', type: 'button', dataset: { k: 'state' },
        onclick: () => change(() => post(userPath, { disabled: true }), S.userUpdated, { title: S.disableUserTitle, text: S.disableText(u.name, self), confirmLabel: S.disableUser }) }, S.disableUser);
    // default group
    const dgIn = h('input', { class: 'input input-sm grow', value: u.default_group || '', 'aria-label': S.fDefaultGroup, autocomplete: 'off', spellcheck: 'false', dataset: { k: 'dg' }, style: { 'max-width': '320px' } });
    const saveDg = () => {
      const g = dgIn.value.trim();
      if (!g) { d.setError(S.groupNameRequired); dgIn.focus(); return; }
      change(() => post(userPath, { default_group: g }), S.userUpdated);
    };
    dgIn.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); saveDg(); } });
    // grants
    const grants = arr(u.grants);
    const grantRows = grants.map((g) => h('li', null,
      h('code', { class: 'grow', title: g.pattern }, g.pattern),
      (() => {
        const sel = roleSelect(g.role, (v) => change(() => post('/admin/grants', { user: u.name, pattern: g.pattern, role: v }), S.grantSaved), S.roleFor(g.pattern));
        sel.dataset.k = `grant-role:${g.pattern}`;
        return sel;
      })(),
      h('button', { class: 'btn btn-sm btn-danger', type: 'button', dataset: { k: `grant-rm:${g.pattern}` },
        onclick: () => change(() => post('/admin/grants/revoke', { user: u.name, pattern: g.pattern }), S.grantRevoked,
          { title: S.revokeGrant, text: S.revokeGrantText(u.name, g.pattern), confirmLabel: S.revoke }) }, S.revoke)));
    const pat = h('input', { class: 'input input-sm grow', placeholder: S.patternPh, 'aria-label': S.fPattern, autocomplete: 'off', spellcheck: 'false', dataset: { k: 'grant-pat' } });
    const patRole = roleSelect('reader', null, S.colRole);
    patRole.dataset.k = 'grant-new-role';
    const addGrant = () => {
      const p = pat.value.trim();
      if (!p) { d.setError(S.patternRequired); pat.focus(); return; }
      change(() => post('/admin/grants', { user: u.name, pattern: p, role: patRole.value }), S.grantSaved);
    };
    pat.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); addGrant(); } });
    // tokens
    const tokens = arr(u.tokens);
    const newTok = h('button', { class: 'btn btn-sm', type: 'button', dataset: { k: 'tok-new' },
      onclick: () => openTokenDialog({
        title: S.newTokenFor(u.name), nameRequired: false,
        create: (body) => post(`${userPath}/tokens`, body),
        onCreated: () => { emitAccess(); load(); },
      }) }, icon('plus', 14), S.newToken);
    fill(box,
      h('div', { class: 'row', style: { 'flex-wrap': 'wrap' } },
        u.admin ? badge(S.adminBadge, 'accent') : null,
        u.disabled ? badge(S.disabledBadge, 'red') : badge(S.activeBadge, 'green'),
        self ? pill(S.you) : null,
        h('span', { class: 'muted small' }, S.createdOn(fmtDay(ms(u.created_at))))),
      section(S.accountSec, h('div', { class: 'row', style: { 'flex-wrap': 'wrap' } }, adminBtn, stateBtn)),
      section(S.fDefaultGroup, h('div', { class: 'row' }, dgIn,
        h('button', { class: 'btn btn-sm', type: 'button', dataset: { k: 'dg-save' }, onclick: saveDg }, S.save))),
      section(S.grantsN(grants.length),
        grants.length ? h('ul', { class: 'ulist' }, grantRows) : h('p', { class: 'muted small' }, S.noUserGrants),
        h('div', { class: 'row' }, pat, patRole,
          h('button', { class: 'btn btn-sm', type: 'button', dataset: { k: 'grant-add' }, onclick: addGrant }, icon('plus', 14), S.addGrant))),
      section(S.tokensN(tokens.length),
        h('div', { class: 'row' }, newTok),
        tokenTable(tokens, {
          label: S.tokensN(tokens.length),
          currentId: session.me && session.me.token && session.me.token.id,
          onRevoke: (t) => change(() => post(`/admin/tokens/${enc(t.id)}/revoke`), S.tokenRevoked, {
            title: S.revokeToken,
            text: S.revokeTokenText(t.name || t.prefix) + (session.me && session.me.token && t.id === session.me.token.id ? S.revokeOwnNote : ''),
            confirmLabel: S.revoke,
          }),
        })));
    if (active) {
      const el = box.querySelector(`[data-k="${CSS.escape(active)}"]`);
      if (el) el.focus();
    }
  }
  load();
}

/* ---- keyboard ----------------------------------------------------------- */
function onGlobalKey(ev) {
  if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (document.querySelector('dialog[open]') || !$('#blocked').hidden || session.locked) return;
  const typing = isTyping(ev.target);
  if (ev.key === 'Escape') {
    if (typing) return;
    if (menu) closeGroupMenu(true);
    else if (acctMenu) closeAccountMenu(true);
    else if (state.sel) setState({ sel: null });
    else if (state.highlight.size) setState({ highlight: new Set() });
    return;
  }
  if (typing) return;
  const a = (mounted && mounted.api) || {};
  const inGroup = !!state.group && isDataView();
  switch (ev.key) {
    case '/': if (a.focusSearch) a.focusSearch(); break;
    case 'f': if (a.fit) a.fit(); else return; break;
    case '[': if (inGroup) stepAxis('at', -1); break;
    case ']': if (inGroup) stepAxis('at', 1); break;
    case '{': if (inGroup) stepAxis('asOf', -1); break;
    case '}': if (inGroup) stepAxis('asOf', 1); break;
    default: return;
  }
  ev.preventDefault();
}

/* ---- boot --------------------------------------------------------------- */
initTheme();
function boot() {
  $('#panel').inert = true;
  buildSidebar();
  buildTopbar();
  buildStrip();
  rebuildLabelColors();
  window.addEventListener('hashchange', onUrl);
  window.addEventListener('popstate', onUrl);
  document.addEventListener('keydown', onGlobalKey);
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', updateThemeButton);
  // rights changed elsewhere (a grant, a revoked token) show when the tab comes back
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && session.running && session.mode === 'login') refreshMe();
  });
  loadSession();
}
/** Who is this page? Then the views, or the login (401). */
async function loadSession() {
  let me = null;
  try {
    me = await api('GET', '/me', { auth: true, group: null, quiet: true });
  } catch (e) {
    // 401: the login is up; a guard 403: the blocked card is
    if (e.status === 401 || !$('#blocked').hidden) return;
    // an older server without /ui/api/me, or none reachable: carry on as before, rights unknown
  }
  startApp(me);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
