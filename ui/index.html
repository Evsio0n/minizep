<style>
/* ---- tokens ---------------------------------------------------------- */
:root {
  color-scheme: light;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-3: #e2e8f0;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #0f172a; --text-2: #334155; --text-3: #64748b; --text-4: #94a3b8;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff; --accent-fg: #4338ca; --on-accent: #ffffff; --sel: #4f46e5;
  --green: #16a34a; --blue: #2563eb; --slate: #64748b; --red: #dc2626; --amber: #d97706;
  --green-bg: #dcfce7; --green-fg: #166534; --blue-bg: #dbeafe; --blue-fg: #1e40af;
  --slate-bg: #f1f5f9; --slate-fg: #475569; --red-bg: #fee2e2; --red-fg: #991b1b;
  --amber-bg: #fef3c7; --amber-fg: #92400e;
  --edge: #64748b; --node-stroke: #0f172a; --grid-dot: #e2e8f0; --halo: #ffffff;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 12px 32px rgba(15, 23, 42, .14), 0 2px 6px rgba(15, 23, 42, .06);
  --backdrop: rgba(15, 23, 42, .4);
  --lc-0: #ec4899; --lc-1: #3b82f6; --lc-2: #10b981; --lc-3: #f59e0b; --lc-4: #6366f1;
  --lc-5: #f97316; --lc-6: #14b8a6; --lc-7: #a855f7; --lc-8: #06b6d4; --lc-9: #84cc16;
  --lc-10: #f43f5e; --lc-11: #8b5cf6; --lc-12: #22c55e; --lc-13: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b1120; --surface: #0f172a; --surface-2: #1e293b; --surface-3: #334155;
    --border: #1e293b; --border-strong: #334155;
    --text: #e2e8f0; --text-2: #cbd5e1; --text-3: #94a3b8; --text-4: #64748b;
    --accent: #6366f1; --accent-hover: #818cf8; --accent-soft: rgba(99, 102, 241, .18); --accent-fg: #a5b4fc; --sel: #818cf8;
    --green: #4ade80; --blue: #60a5fa; --slate: #94a3b8; --red: #f87171; --amber: #fbbf24;
    --green-bg: rgba(74, 222, 128, .14); --green-fg: #86efac; --blue-bg: rgba(96, 165, 250, .16); --blue-fg: #93c5fd;
    --slate-bg: rgba(148, 163, 184, .14); --slate-fg: #cbd5e1; --red-bg: rgba(248, 113, 113, .15); --red-fg: #fca5a5;
    --amber-bg: rgba(251, 191, 36, .14); --amber-fg: #fcd34d;
    --edge: #94a3b8; --node-stroke: #e2e8f0; --grid-dot: #1e293b; --halo: #0f172a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --backdrop: rgba(2, 6, 23, .6);
    --lc-0: #f472b6; --lc-1: #60a5fa; --lc-2: #34d399; --lc-3: #fbbf24; --lc-4: #818cf8;
    --lc-5: #fb923c; --lc-6: #2dd4bf; --lc-7: #c084fc; --lc-8: #22d3ee; --lc-9: #a3e635;
    --lc-10: #fb7185; --lc-11: #a78bfa; --lc-12: #4ade80; --lc-13: #f87171;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1120; --surface: #0f172a; --surface-2: #1e293b; --surface-3: #334155;
  --border: #1e293b; --border-strong: #334155;
  --text: #e2e8f0; --text-2: #cbd5e1; --text-3: #94a3b8; --text-4: #64748b;
  --accent: #6366f1; --accent-hover: #818cf8; --accent-soft: rgba(99, 102, 241, .18); --accent-fg: #a5b4fc; --sel: #818cf8;
  --green: #4ade80; --blue: #60a5fa; --slate: #94a3b8; --red: #f87171; --amber: #fbbf24;
  --green-bg: rgba(74, 222, 128, .14); --green-fg: #86efac; --blue-bg: rgba(96, 165, 250, .16); --blue-fg: #93c5fd;
  --slate-bg: rgba(148, 163, 184, .14); --slate-fg: #cbd5e1; --red-bg: rgba(248, 113, 113, .15); --red-fg: #fca5a5;
  --amber-bg: rgba(251, 191, 36, .14); --amber-fg: #fcd34d;
  --edge: #94a3b8; --node-stroke: #e2e8f0; --grid-dot: #1e293b; --halo: #0f172a;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --backdrop: rgba(2, 6, 23, .6);
  --lc-0: #f472b6; --lc-1: #60a5fa; --lc-2: #34d399; --lc-3: #fbbf24; --lc-4: #818cf8;
  --lc-5: #fb923c; --lc-6: #2dd4bf; --lc-7: #c084fc; --lc-8: #22d3ee; --lc-9: #a3e635;
  --lc-10: #fb7185; --lc-11: #a78bfa; --lc-12: #4ade80; --lc-13: #f87171;
}

/* ---- base ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
ul { margin: 0; padding: 0; list-style: none; }
code, .mono { font-family: var(--mono); font-size: 12px; }
a { color: var(--accent-fg); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.txt-red { color: var(--red); }
.ico { flex: none; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- controls -------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--red-fg); border-color: var(--red); background: var(--red-bg); }
.btn-danger:hover { background: var(--red-bg); filter: brightness(.97); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn-icon { width: 32px; padding: 0; }
.btn-sm.btn-icon { width: 26px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-fg); border-color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--accent-fg); cursor: pointer; text-align: left; }
.link:hover { text-decoration: underline; }
.icon-btn { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.input { height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); min-width: 0; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.input-sm { height: 28px; font-size: 12px; padding: 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--surface); height: 30px; padding: 0 12px; cursor: pointer; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-fg); font-weight: 600; }
.fchips { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fchips-label { font-size: 12px; color: var(--text-3); margin-right: 2px; }
.fchip { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.fchip .count { color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ---- pills, badges, chips ------------------------------------------- */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill.rel { font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em; }
.label-pill { background: var(--surface-2); border-color: var(--c, var(--border)); background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--text); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.b-green { background: var(--green-bg); color: var(--green-fg); }
.b-green-o { border-color: var(--green); color: var(--green-fg); }
.b-blue { background: var(--blue-bg); color: var(--blue-fg); }
.b-slate { background: var(--slate-bg); color: var(--slate-fg); }
.b-red { background: var(--red-bg); color: var(--red-fg); }
.b-amber-o { border-color: var(--amber); color: var(--amber-fg); }
.tag { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; background: var(--blue); color: var(--surface); }
.badges { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); font-size: 12px; border: 1px solid var(--border); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.sdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--slate); }
.sdot.processed { background: var(--green); }
.sdot.pending { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
.sdot.failed { background: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }
.uuid { display: inline-flex; align-items: center; gap: 2px; }
.uuid code { color: var(--text-3); }
.scorebar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; vertical-align: middle; }
.scorebar > span { display: block; height: 100%; background: var(--accent); }

/* ---- shell ----------------------------------------------------------- */
.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--text-2); text-decoration: none; white-space: nowrap; overflow: hidden; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-fg); font-weight: 600; }
.nav-section { margin: 16px 10px 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); display: flex; flex-direction: column; gap: 4px; }
.side-status { display: flex; align-items: center; gap: 8px; }
.side-status .sdot.ok { background: var(--green); }
.side-status .sdot.bad { background: var(--red); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-size: 14px; }
.crumbs a { color: var(--text-3); text-decoration: none; }
.crumbs a:hover { color: var(--text); text-decoration: underline; }
.crumb-cur { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .ico { color: var(--text-4); }
.switcher { position: relative; }
.switcher > .btn { max-width: 240px; }
.switcher-name { overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 40; }
.menu-list { max-height: 300px; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
.menu-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-2); outline: none; }
.menu-item[aria-current="true"] { color: var(--accent-fg); font-weight: 600; }
.menu-item .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-open { display: flex; gap: 6px; padding: 6px 4px 2px; border-top: 1px solid var(--border); margin-top: 6px; }
.menu-empty { padding: 8px 10px; color: var(--text-3); font-size: 12px; }

/* ---- time strip ------------------------------------------------------ */
.strip { flex: none; background: var(--surface); border-bottom: 1px solid var(--border); }
.strip-row { height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 20px; white-space: nowrap; overflow: hidden; }
.strip-field { display: inline-flex; align-items: center; gap: 6px; }
.strip-label { font-size: 12px; color: var(--text-3); font-weight: 500; }
.time-btn { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.time-btn.past { border-color: var(--amber); color: var(--amber-fg); background: var(--amber-bg); }
.strip-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.strip-check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
.track { height: 40px; display: grid; grid-template-columns: 172px minmax(80px, 1fr) 176px auto auto; align-items: center; gap: 10px; padding: 0 16px 0 20px; border-top: 1px dashed var(--border); }
.track-label { display: flex; flex-direction: column; line-height: 1.2; font-size: 12px; font-weight: 600; min-width: 0; }
.track-label .muted { font-weight: 400; font-size: 11px; }
.trk-wrap { min-width: 0; overflow: hidden; height: 32px; }
.trk { width: 100%; height: 32px; display: block; cursor: pointer; touch-action: none; user-select: none; }
.trk .base { stroke: var(--border-strong); stroke-width: 2; stroke-linecap: round; }
.trk .tick { stroke: var(--text-4); stroke-width: 1; }
.trk .nowline { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.trk .nowtxt { font-size: 9px; fill: var(--text-3); }
.trk .cur line { stroke: var(--accent); stroke-width: 2; }
.trk .cur circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.trk .cur { outline: none; cursor: grab; }
.trk .cur:focus-visible circle { fill: var(--accent); stroke-width: 3; }
.track-zone { font-size: 11px; color: var(--text-3); white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.time-banner { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 20px; background: var(--amber-bg); color: var(--amber-fg); font-size: 13px; border-bottom: 1px solid var(--border); }
.time-banner .link { color: inherit; font-weight: 600; text-decoration: underline; }

/* ---- page ------------------------------------------------------------ */
.view { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 24px; outline: none; }
.view.fill { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head form { display: flex; gap: 8px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
.info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--text-3); min-height: 20px; flex: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 48px 16px; color: var(--text-3); }
.empty h3 { color: var(--text); }
.empty .row { margin-top: 8px; justify-content: center; flex-wrap: wrap; }
.skel-list { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.skel-row { display: flex; gap: 16px; }
.skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---- table ----------------------------------------------------------- */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: auto; min-height: 0; }
.view.fill > .table-wrap { flex: 1; }
.table-wrap.busy { opacity: .6; transition: opacity .15s; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; font-weight: 600; font-size: 12px; color: var(--text-3); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr[tabindex] { cursor: pointer; }
.tbl tbody tr[tabindex]:hover { background: var(--surface-2); }
.tbl tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tbl tr.dim-row td { opacity: .5; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .nowrap { white-space: nowrap; }
.th-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.th-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tbl .fact-cell { min-width: 240px; max-width: 460px; }
.ends { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ends .sep { color: var(--text-4); }
.validity { display: flex; flex-direction: column; gap: 3px; min-width: 150px; }

/* ---- graph page ------------------------------------------------------ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; flex: none; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.stat-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 500; color: var(--text-3); }
.stat-value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; overflow-wrap: anywhere; }
.graph-card { position: relative; flex: 1; min-height: 320px; background-color: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 22px 22px; container-type: inline-size; }
.graph-card.busy::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: busy 1s linear infinite; z-index: 5; }

.graph-host { position: absolute; inset: 0; outline: none; }

const SVG_NS = 'http://www.w3.org/2000/svg';
const $ = (sel, root = document) => root.querySelector(sel);
let uidSeq = 0;

/** Applies attributes: class, style (object), text, on<event> handlers, dataset, the rest via setAttribute. */
function setAttrs(el, attrs) {
  if (!attrs) return el;
  for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.setAttribute('class', Array.isArray(v) ? v.filter(Boolean).join(' ') : String(v));
    else if (k === 'style' && typeof v === 'object') {
      for (const p of Object.keys(v)) if (v[p] !== undefined && v[p] !== null) el.style.setProperty(p, String(v[p]));
    } else if (k === 'text') el.textContent = String(v);
    else if (k.length > 2 && k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  return el;
}
function addKids(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false || k === true) continue;
    el.append(k instanceof Node ? k : String(k)); // strings become text nodes, never markup
  }
  return el;
}
/** DOM builder: h('div', {class: 'x', onclick}, 'text', child, [more]). */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  if (attrs && Object.prototype.hasOwnProperty.call(attrs, 'value')) {
    value = attrs.value;
    attrs = { ...attrs };
    delete attrs.value;
  }
  setAttrs(el, attrs);
  addKids(el, kids);
  if (value !== undefined && value !== null) el.value = String(value);
  return el;
}
/** Replaces an element's children; like h(), skips null/false and flattens arrays. */
function fill(el, ...kids) {
  el.replaceChildren();
  return addKids(el, kids);
}
/** The same for SVG elements. */
function sv(tag, attrs, ...kids) {
  return addKids(setAttrs(document.createElementNS(SVG_NS, tag), attrs), kids);
}

const switchView = (group) => (isDataView() ? state.view : state.view === 'members' && canManage(group) ? 'members' : 'graph');
function toggleGroupMenu() {
  if (menu) return closeGroupMenu();
  closeAccountMenu();
  const list = h('div', { class: 'menu-list', role: 'menu', 'aria-label': S.groups });
  const input = h('input', { class: 'input grow', placeholder: S.openGroupPh, 'aria-label': S.openGroup });

    const groups = arr(data && data.groups);
    if (!groups.length) return list.replaceChildren(h('div', { class: 'menu-empty' }, S.noGroupsYet));
    list.replaceChildren(...groups.map((g) => h('button', {
      class: 'menu-item', type: 'button', role: 'menuitem', 'aria-current': String(g.group_id === state.group),
      onclick: () => { closeGroupMenu(); go(switchView(g.group_id), g.group_id); },
    }, h('span', { class: 'grow' }, g.group_id), roleBadge(g.role), h('span', { class: 'muted small' }, S.nFacts(num(g.facts))))));
  };
  if (state.groupsList) fillMenu(state.groupsList);
  else list.replaceChildren(h('div', { class: 'menu-empty' }, S.loading));
  api('GET', '/groups', { group: null, quiet: true }).then((r) => { state.groupsList = r; if (menu) fillMenu(r); })
    .catch(() => { if (menu && !state.groupsList) list.replaceChildren(h('div', { class: 'menu-empty' }, S.groupsUnavailable)); });
  menu.addEventListener('keydown', (ev) => {
    const items = [...menu.querySelectorAll('.menu-item'), input];
    const i = items.indexOf(document.activeElement);
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); closeGroupMenu(true); }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  });
  tb.switcher.append(menu);
  tb.switchBtn.setAttribute('aria-expanded', 'true');
  document.addEventListener('pointerdown', onMenuOutside, true);
  const first = menu.querySelector('.menu-item');
  (first || input).focus();
}

/* server status line (polled every 10 s) */
let statusTimer = 0;
let statusSeq = 0; // an answer of an older round (another login) schedules nothing
async function refreshStatus() {
  clearTimeout(statusTimer);
  const seq = ++statusSeq;
  try {
    const s = await api('GET', '/status', { group: null, quiet: true });
    if (seq !== statusSeq) return;
    state.status = s;
    nav.statusDot.className = 'sdot ok';
    nav.statusText.textContent = S.connected;
    nav.status.title = S.statusTip(s);
    const jobs = ((s.jobs && s.jobs.queued) || 0) + ((s.jobs && s.jobs.running) || 0);
    nav.jobsText.hidden = !jobs;
    nav.jobsText.textContent = S.jobsRunning(jobs);
  } catch (e) {
    if (seq !== statusSeq) return;
    nav.statusDot.className = 'sdot bad';
    nav.statusText.textContent = e && e.status ? `${S.offline} (${e.status})` : S.offline;
    nav.status.title = e && e.message ? e.message : '';
    nav.jobsText.hidden = true;
  }
  if (session.locked) return;
  statusTimer = setTimeout(refreshStatus, 10000);
}

/* ---------------------------------------------------------------- 7. graph */
/* Force constants follow getzep's reference visualizer, scaled down. */
const G = {
  LINK_DIST: 110, LINK_K: 0.2,
  CHARGE: -300, MIN_D2: 20 * 20, MAX_D2: 500 * 500,
  CENTER_K: 0.05,
  COLLIDE_PAD: 8, COLLIDE_K: 0.7,
  RADIAL_R: 100, RADIAL_K: 0.1,
  DECAY: 0.4, ALPHA_DECAY: 0.985, ALPHA_MIN: 0.01, WARM_ALPHA: 0.3, DRAG_ALPHA: 0.1,
  ANCHOR_K: 0.35, // warm restarts hold surviving nodes near where they were
  PAIR_GAP: 28,
  OVERLAY_TOP: 44, OVERLAY_BOTTOM: 36, // px of the card covered by the search bar / zoom buttons
  ZOOM_MIN: 0.1, ZOOM_MAX: 4, ZOOM_INIT: 0.8,
  NODE_LABELS_MAX: 150, EDGE_LABELS_MAX: 120, LABEL_ZOOM: 1.2,
  SYNC_TICKS_ABOVE: 300, SYNC_TICKS: 150, SYNC_BUDGET_MS: 120, // the warm-up never holds the first paint longer
};
const PILL_FONT = () => `600 9px ${getComputedStyle(document.body).fontFamily}`;
const SUB_FONT = () => `500 8px ${getComputedStyle(document.body).fontFamily}`;
const r1 = (v) => Math.round(v * 10) / 10;
const nodeRadius = (degree) => Math.min(18, 6 + 2 * Math.sqrt(Math.max(0, degree || 0)));

/** Plain velocity-Verlet force simulation (O(n²) repulsion; fine up to ~600 nodes). */
class Sim {
  constructor() {
    this.nodes = [];
    this.links = [];
    this.alpha = 0;
    this.anchored = false;
  }
  set(nodes, links) {
    this.nodes = nodes;
    this.links = links;
    const count = new Map();
    for (const l of links) {
      count.set(l.s, (count.get(l.s) || 0) + 1);
      count.set(l.t, (count.get(l.t) || 0) + 1);
    }
    for (const l of links) l.bias = count.get(l.s) / (count.get(l.s) + count.get(l.t));
  }
  get running() { return this.alpha >= G.ALPHA_MIN; }
  tick() {
    const a = this.alpha;
    const nodes = this.nodes;
    const n = nodes.length;
    // link springs
    for (const l of this.links) {
      const s = l.s;
      const t = l.t;
      let dx = t.x + t.vx - s.x - s.vx;
      let dy = t.y + t.vy - s.y - s.vy;
      const d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      const k = ((d - G.LINK_DIST) / d) * a * G.LINK_K;
      dx *= k;
      dy *= k;
      t.vx -= dx * l.bias;
      t.vy -= dy * l.bias;
      s.vx += dx * (1 - l.bias);
      s.vy += dy * (1 - l.bias);
    }
    // repulsion between every pair, and collision
    for (let i = 0; i < n; i++) {
      const p = nodes[i];
      for (let j = i + 1; j < n; j++) {
        const q = nodes[j];
        let dx = q.x - p.x;
        let dy = q.y - p.y;
        let d2 = dx * dx + dy * dy;
        if (d2 === 0) {
          dx = (Math.random() - 0.5) * 1e-3;
          dy = (Math.random() - 0.5) * 1e-3;
          d2 = dx * dx + dy * dy;
        }
        if (d2 < G.MAX_D2) {
          const w = (G.CHARGE * a) / Math.max(d2, G.MIN_D2);
          p.vx += dx * w;
          p.vy += dy * w;
          q.vx -= dx * w;
          q.vy -= dy * w;
        }
        const rr = p.r + q.r + G.COLLIDE_PAD;
        if (d2 < rr * rr) {
          const d = Math.sqrt(d2);
          const l = ((rr - d) / d) * G.COLLIDE_K * 0.5;
          p.vx -= dx * l;
          p.vy -= dy * l;
          q.vx += dx * l;
          q.vy += dy * l;
        }
      }
    }
    for (const p of nodes) {
      // gentle pull to the centre
      p.vx -= p.x * G.CENTER_K * a;
      p.vy -= p.y * G.CENTER_K * a;
      // isolated nodes settle on a ring
      if (p.isolated) {
        const d = Math.sqrt(p.x * p.x + p.y * p.y) || 1e-6;
        const k = ((G.RADIAL_R - d) / d) * G.RADIAL_K * a;
        p.vx += p.x * k;
        p.vy += p.y * k;
      }
      if (this.anchored && p.ax !== null && p.ax !== undefined) {
        p.vx += (p.ax - p.x) * G.ANCHOR_K;
        p.vy += (p.ay - p.y) * G.ANCHOR_K;
      }
    }
    for (const p of nodes) {
      if (p.fx !== null) {
        p.x = p.fx;
        p.y = p.fy;
        p.vx = 0;
        p.vy = 0;
        continue;
      }
      p.vx *= 1 - G.DECAY;
      p.vy *= 1 - G.DECAY;
      p.x += p.vx;
      p.y += p.vy;
    }
    this.alpha *= G.ALPHA_DECAY;
  }
}

let graphSeq = 0;
/**
 * SVG renderer. Layers bottom to top: edges, edge hit-paths, edge pills,
 * nodes, node labels. Public API: setData, highlight, highlightType,
 * select, fit, zoomBy, centerOn, destroy.
 */
class GraphView {
  constructor(host, handlers = {}) {
    this.host = host;
    this.on = handlers;
    this.uid = ++graphSeq;
    this.nodes = new Map();
    this.edges = new Map();
    this.sim = new Sim();
    this.k = G.ZOOM_INIT;
    this.tx = 0;
    this.ty = 0;
    this.w = 0;
    this.hgt = 0;
    this.sel = null;
    this.hl = null;
    this.typeHl = null;
    this.raf = 0;
    this.fitted = false; // the one automatic fit after the first layout has happened (or is no longer wanted)
    this.pendingFocus = null; // a selection restored from the URL, framed instead of that fit
    this.anim = 0;
    this.drag = null;
    this.destroyed = false;
    this.history = false;

    this.svg = sv('svg', { class: 'graph-svg', role: 'img', 'aria-label': S.graphAria });
    const defs = sv('defs');
    for (const st of ['active', 'future', 'ended', 'retracted', 'sel']) {
      defs.append(sv('marker', {
        id: this.markerId(st), viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7,
        markerUnits: 'userSpaceOnUse', orient: 'auto',
      }, sv('path', { d: 'M0,1 L9,5 L0,9 z', class: `arrow a-${st}` })));
    }
    this.vp = sv('g');
    this.gEdges = sv('g');
    this.gHits = sv('g');
    this.gPills = sv('g');
    this.gNodes = sv('g');
    this.gLabels = sv('g');
    this.vp.append(this.gEdges, this.gHits, this.gPills, this.gNodes, this.gLabels);
    this.svg.append(defs, sv('rect', { class: 'graph-bg', x: 0, y: 0, width: '100%', height: '100%' }), this.vp);
    this.tip = h('div', { class: 'graph-tip', hidden: true });
    host.append(this.svg, this.tip);

    this.measure();
    this.tx = this.w / 2;
    this.ty = this.hgt / 2;
    this.applyTransform();
    this.frame = this.frame.bind(this);
    this.ro = typeof ResizeObserver === 'function' ? new ResizeObserver(() => this.onResize()) : null;
    if (this.ro) this.ro.observe(host);
    this.bind();
  }
  markerId(st) { return `mz-arrow-${this.uid}-${st}`; }
  measure() {
    this.w = this.host.clientWidth || 800;
    this.hgt = this.host.clientHeight || 500;
  }
  onResize() {
    const ow = this.w;
    const oh = this.hgt;
    this.measure();
    this.tx += (this.w - ow) / 2;
    this.ty += (this.hgt - oh) / 2;
    this.applyTransform();
  }

  /* ---- data ---- */
  setData({ nodes, edges, history }) {
    this.history = !!history;
    // nothing on screen yet: a full layout (and one auto-fit) instead of a warm restart
    const first = this.nodes.size === 0;
    if (first) this.fitted = false;
    const incoming = new Map();
    for (const n of arr(nodes)) if (n && n.uuid) incoming.set(n.uuid, n);
    const edgeList = arr(edges).filter((e) => e && e.uuid && e.source_uuid && e.target_uuid);
    // endpoints the node list does not carry still get a node
    for (const e of edgeList) {
      if (!incoming.has(e.source_uuid)) incoming.set(e.source_uuid, { uuid: e.source_uuid, name: e.source, labels: [], label: 'Entity' });
      if (!incoming.has(e.target_uuid)) incoming.set(e.target_uuid, { uuid: e.target_uuid, name: e.target, labels: [], label: 'Entity' });
    }
    const deg = new Map();
    const activeDeg = new Map();
    const views = new Map();
    for (const e of edgeList) {
      const v = viewOf(e);
      views.set(e.uuid, v);
      for (const id of [e.source_uuid, e.target_uuid]) {
        deg.set(id, (deg.get(id) || 0) + 1);
        if (v.state === 'active') activeDeg.set(id, (activeDeg.get(id) || 0) + 1);
      }
    }
    const edgeIds = new Set(edgeList.map((e) => e.uuid));
    // leaving
    for (const [id, n] of this.nodes) {
      if (!incoming.has(id)) {
        this.fadeOut([n.g, n.lab]);
        this.nodes.delete(id);
      }
    }
    for (const [id, e] of this.edges) {
      if (!edgeIds.has(id)) {
        this.fadeOut([e.path, e.hit, e.pill]);
        this.edges.delete(id);
      }
    }
    const box = this.bbox([...this.nodes.values()]);
    const fresh = [];
    const entering = [];
    // nodes
    for (const [id, d] of incoming) {
      let n = this.nodes.get(id);
      if (!n) {
        n = { uuid: id, x: NaN, y: NaN, vx: 0, vy: 0, fx: null, fy: null, ax: null, ay: null };
        n.g = sv('g', { class: 'gnode gfade entering', 'data-node': id }, n.c = sv('circle'));
        n.lab = sv('text', { class: 'nlabel gfade entering' });
        this.gNodes.append(n.g);
        this.gLabels.append(n.lab);
        this.nodes.set(id, n);
        fresh.push(n);
        entering.push(n.g, n.lab);
      }
      n.data = d;
      n.label = d.label || primaryLabel(d.labels);
      n.degree = Number.isFinite(d.degree) ? d.degree : deg.get(id) || 0;
      n.r = nodeRadius(n.degree);
      n.isolated = !deg.get(id);
      n.hollow = this.history && !activeDeg.get(id);
      n.c.setAttribute('r', n.r);
      n.g.style.color = labelColor(n.label);
      n.g.classList.toggle('hollow', n.hollow);
      n.lab.classList.toggle('hollow', n.hollow);
      const name = String(d.name ?? shortId(id));
      if (n.lab.textContent !== name) n.lab.textContent = name;
    }
    // edges
    for (const d of edgeList) {
      let e = this.edges.get(d.uuid);
      if (!e) {
        e = { uuid: d.uuid, pillKey: '' };
        e.path = sv('path', { class: 'edge gfade entering' });
        e.hit = sv('path', { class: 'edge-hit', 'data-edge': d.uuid });
        e.pill = sv('g', { class: 'epill gfade entering', 'data-edge': d.uuid });
        this.gEdges.append(e.path);
        this.gHits.append(e.hit);
        this.gPills.append(e.pill);
        this.edges.set(d.uuid, e);
        entering.push(e.path, e.pill);
      }
      e.data = d;
      e.s = this.nodes.get(d.source_uuid);
      e.t = this.nodes.get(d.target_uuid);
      const v = views.get(d.uuid);
      e.state = STATES.includes(v.state) ? v.state : 'active';
      e.endsAt = v.endsAt;
      e.revised = !!v.revisedLater;
      for (const st of STATES) {
        e.path.classList.toggle(`s-${st}`, st === e.state);
        e.pill.classList.toggle(`s-${st}`, st === e.state);
      }
      this.buildPill(e);
    }
    this.placeFresh(fresh, box, first);
    this.computeOffsets();
    // simulation links: one spring per connected pair
    const links = [];
    const seen = new Set();
    for (const e of this.edges.values()) {
      if (e.s === e.t) continue;
      const key = e.s.uuid < e.t.uuid ? `${e.s.uuid}|${e.t.uuid}` : `${e.t.uuid}|${e.s.uuid}`;
      if (seen.has(key)) continue;
      seen.add(key);
      links.push({ s: e.s, t: e.t, key });
    }
    // springs that appeared or went away since the last data (time moved, history toggled)
    const oldKeys = new Set(this.sim.links.map((l) => l.key));
    const moved = new Set(fresh);
    for (const l of links) if (!oldKeys.has(l.key)) moved.add(l.s).add(l.t);
    for (const l of this.sim.links) {
      if (seen.has(l.key)) continue;
      for (const n of [l.s, l.t]) if (this.nodes.get(n.uuid) === n) moved.add(n);
    }
    this.sim.set([...this.nodes.values()], links);
    if (first && !this.nodes.size) {
      this.sim.alpha = 0; // nothing to lay out; the next non-empty data is a first layout again
    } else if (first) {
      this.sim.alpha = 1;
      this.sim.anchored = false;
      if (this.nodes.size > G.SYNC_TICKS_ABOVE) {
        const t0 = performance.now();
        for (let i = 0; i < G.SYNC_TICKS && performance.now() - t0 < G.SYNC_BUDGET_MS; i++) this.sim.tick();
      }
    } else if (moved.size) {
      // warm restart: every node keeps x/y/vx/vy. Nodes whose springs changed
      // (and new ones) move to their partners; the rest are held near their
      // spot, unless the first layout is still running or they were still
      // on their way from the previous restart
      const settling = this.sim.running;
      const hold = this.sim.anchored || !settling;
      for (const n of this.nodes.values()) {
        const free = !hold || moved.has(n) || (settling && n.ax === null);
        if (free) { n.ax = null; n.ay = null; } else { n.ax = n.x; n.ay = n.y; }
      }
      this.sim.anchored = hold;
      this.sim.alpha = Math.max(this.sim.alpha, G.WARM_ALPHA);
    }
    this.applyFocus();
    this.applyTransform();
    this.render();
    if (entering.length) {
      void this.svg.getBoundingClientRect(); // commit opacity 0 so the fade-in transitions
      requestAnimationFrame(() => { for (const el of entering) el.classList.remove('entering'); });
    }
    this.start();
  }
  /** New nodes: at the mean of placed neighbours plus jitter, else inside the current bounding box. */
  placeFresh(fresh, box, first) {
    if (!fresh.length) return;
    if (first) {
      // phyllotaxis spiral: a deterministic, even start
      fresh.forEach((n, i) => {
        const rad = 10 * Math.sqrt(0.5 + i);
        const ang = i * Math.PI * (3 - Math.sqrt(5));
        n.x = rad * Math.cos(ang);
        n.y = rad * Math.sin(ang);
      });
      return;
    }
    const adj = new Map();
    for (const e of this.edges.values()) {
      if (!e.s || !e.t || e.s === e.t) continue;
      if (!adj.has(e.s)) adj.set(e.s, []);
      if (!adj.has(e.t)) adj.set(e.t, []);
      adj.get(e.s).push(e.t);
      adj.get(e.t).push(e.s);
    }
    let pending = fresh.slice();
    for (let pass = 0; pass < 4 && pending.length; pass++) {
      const rest = [];
      for (const n of pending) {
        const placed = (adj.get(n) || []).filter((m) => Number.isFinite(m.x));
        if (!placed.length) { rest.push(n); continue; }
        n.x = placed.reduce((s, m) => s + m.x, 0) / placed.length + (Math.random() - 0.5) * 40;
        n.y = placed.reduce((s, m) => s + m.y, 0) / placed.length + (Math.random() - 0.5) * 40;
      }
      if (rest.length === pending.length) break;
      pending = rest;
    }
    const b = box || { x0: -150, y0: -150, x1: 150, y1: 150 };
    for (const n of pending) {
      if (Number.isFinite(n.x)) continue;
      n.x = b.x0 + Math.random() * (b.x1 - b.x0);
      n.y = b.y0 + Math.random() * (b.y1 - b.y0);
    }
  }
  bbox(list) {
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    for (const n of list) {
      if (!Number.isFinite(n.x)) continue;
      x0 = Math.min(x0, n.x - n.r);
      y0 = Math.min(y0, n.y - n.r);
      x1 = Math.max(x1, n.x + n.r);
      y1 = Math.max(y1, n.y + n.r);
    }
    return x0 === Infinity ? null : { x0, y0, x1, y1 };
  }
  /** Parallel edges between one pair (either direction) curve apart; self-loops stack. */
  computeOffsets() {
    const groups = new Map();
    for (const e of this.edges.values()) {
      const a = e.s.uuid;
      const b = e.t.uuid;
      const key = a < b ? `${a}|${b}` : `${b}|${a}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    for (const list of groups.values()) {
      list.sort((x, y) => (x.uuid < y.uuid ? -1 : x.uuid > y.uuid ? 1 : 0));
      const n = list.length;
      list.forEach((e, i) => {
        if (e.s === e.t) { e.off = 0; e.loop = i; return; }
        const off = (i - (n - 1) / 2) * G.PAIR_GAP;
        e.off = e.s.uuid < e.t.uuid ? off : -off; // offsets are measured on the canonical direction
        e.loop = -1;
      });
    }
  }
  buildPill(e) {
    const d = e.data;
    const rel = String(d.relation || '?');
    const valid = ms(d.valid_at);
    const sub = e.state === 'future' && valid !== null ? S.edgeFrom(fmtMonth(valid))
      : e.state === 'ended' && e.endsAt !== null ? S.edgeUntil(fmtMonth(e.endsAt)) : '';
    const key = `${e.state}|${rel}|${sub}|${e.revised}`;
    if (key === e.pillKey) return;
    e.pillKey = key;
    const w1 = textWidth(rel, PILL_FONT());
    const w2 = sub ? textWidth(sub, SUB_FONT()) : 0;
    const w = Math.ceil(Math.max(w1, w2)) + 12;
    const hh = sub ? 23 : 14;
    const kids = [
      sv('rect', { x: -w / 2, y: -hh / 2, width: w, height: hh, rx: 7 }),
      sv('text', { class: 'rel', x: 0, y: sub ? -1.8 : 3.2, 'text-anchor': 'middle' }, rel),
    ];
    if (e.state === 'ended' || e.state === 'retracted') {
      const y = sub ? -4.8 : 0.2;
      kids.push(sv('line', { class: 'strike', x1: -w1 / 2, x2: w1 / 2, y1: y, y2: y }));
    }
    if (sub) kids.push(sv('text', { class: 'sub', x: 0, y: 8, 'text-anchor': 'middle' }, sub));
    if (e.revised) kids.push(sv('circle', { class: 'rev', cx: w / 2 - 2, cy: -hh / 2 + 2, r: 3.2 }));
    e.pill.replaceChildren(...kids);
  }
  fadeOut(els) {
    for (const el of els) {
      el.classList.add('leaving');
      el.removeAttribute('data-node');
      el.removeAttribute('data-edge');
    }
    setTimeout(() => { for (const el of els) el.remove(); }, 230);
  }

  /* ---- drawing ---- */
  geom(e) {
    const s = e.s;
    const t = e.t;
    if (s === t) {
      const k = 1 + e.loop * 0.6;
      const r = s.r;
      const a0 = -Math.PI * 0.62;
      const a1 = -Math.PI * 0.08;
      const L = 38 * k;
      const sx = s.x + r * Math.cos(a0);
      const sy = s.y + r * Math.sin(a0);
      const ex = s.x + (r + 1) * Math.cos(a1);
      const ey = s.y + (r + 1) * Math.sin(a1);
      const c1x = s.x + (r + L) * Math.cos(a0);
      const c1y = s.y + (r + L) * Math.sin(a0);
      const c2x = s.x + (r + L) * Math.cos(a1);
      const c2y = s.y + (r + L) * Math.sin(a1);
      return {
        d: `M${r1(sx)},${r1(sy)}C${r1(c1x)},${r1(c1y)} ${r1(c2x)},${r1(c2y)} ${r1(ex)},${r1(ey)}`,
        lx: 0.125 * sx + 0.375 * c1x + 0.375 * c2x + 0.125 * ex,
        ly: 0.125 * sy + 0.375 * c1y + 0.375 * c2y + 0.125 * ey,
      };
    }
    const dx = t.x - s.x;
    const dy = t.y - s.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    const mx = (s.x + t.x) / 2;
    const my = (s.y + t.y) / 2;
    if (!e.off) {
      const ux = dx / len;
      const uy = dy / len;
      return {
        d: `M${r1(s.x + ux * s.r)},${r1(s.y + uy * s.r)}L${r1(t.x - ux * (t.r + 1))},${r1(t.y - uy * (t.r + 1))}`,
        lx: mx,
        ly: my,
      };
    }
    const nx = -dy / len;
    const ny = dx / len;
    const cx = mx + nx * e.off * 2;
    const cy = my + ny * e.off * 2;
    let ux = t.x - cx;
    let uy = t.y - cy;
    const ul = Math.sqrt(ux * ux + uy * uy) || 1e-6;
    ux /= ul;
    uy /= ul;
    let vx = cx - s.x;
    let vy = cy - s.y;
    const vl = Math.sqrt(vx * vx + vy * vy) || 1e-6;
    vx /= vl;
    vy /= vl;
    return {
      d: `M${r1(s.x + vx * s.r)},${r1(s.y + vy * s.r)}Q${r1(cx)},${r1(cy)} ${r1(t.x - ux * (t.r + 1))},${r1(t.y - uy * (t.r + 1))}`,
      lx: mx + nx * e.off,
      ly: my + ny * e.off,
    };
  }
  render() {
    for (const n of this.nodes.values()) {
      n.g.setAttribute('transform', `translate(${r1(n.x)},${r1(n.y)})`);
      n.lab.setAttribute('x', r1(n.x + n.r + 5));
      n.lab.setAttribute('y', r1(n.y + 4));
    }
    for (const e of this.edges.values()) {
      const g = this.geom(e);
      e.path.setAttribute('d', g.d);
      e.hit.setAttribute('d', g.d);
      e.pill.setAttribute('transform', `translate(${r1(g.lx)},${r1(g.ly)})`);
    }
  }
  start() {
    if (!this.raf && !this.destroyed) this.raf = requestAnimationFrame(this.frame);
  }
  frame() {
    this.raf = 0;
    if (this.destroyed) return;
    const dragging = !!(this.drag && this.drag.kind === 'node' && this.drag.moved);
    if (!this.sim.running && !dragging) return;
    this.sim.tick();
    this.render();
    if (!this.fitted && (this.sim.alpha < 0.05 || !this.sim.running) && !this.drag) this.settleView();
    if (!this.sim.running) this.sim.anchored = false;
    this.start();
  }
  /** Once the first layout has settled: frame the restored selection, or fit everything. */
  settleView() {
    this.fitted = true;
    const p = this.pendingFocus;
    this.pendingFocus = null;
    if (p && p.kind === 'edge' && this.edges.has(p.id)) {
      const e = this.edges.get(p.id);
      this.fit([e.s.uuid, e.t.uuid], 100, 1.6);
    } else if (p && p.kind === 'node' && this.nodes.has(p.id)) this.centerOn(p.id);
    else if (p && p.kind === 'set') this.fitSet(p.ids);
    else this.fit();
  }
  /** Frames a set of node / edge uuids (e.g. "Show on graph"). */
  fitSet(ids) {
    const nodes = new Set();
    for (const id of ids) {
      const e = this.edges.get(id);
      if (e) { nodes.add(e.s.uuid); nodes.add(e.t.uuid); } else if (this.nodes.has(id)) nodes.add(id);
    }
    if (!nodes.size) return;
    this.userMoved();
    this.fit([...nodes], 80, 1.4);
  }
  /** Frame `sel` when the layout settles (URL restore); now if it already has. */
  focusWhenSettled(sel) {
    if (!sel) return;
    if (!this.fitted) this.pendingFocus = sel;
    else if (sel.kind === 'set') this.fitSet(sel.ids);
    else this.select(sel, { zoom: true });
  }
  /** The user took control of the view: no automatic fit any more. */
  userMoved() {
    this.fitted = true;
    this.pendingFocus = null;
  }

  /* ---- highlight and selection ---- */
  highlight(set) {
    this.hl = set && set.size ? set : null;
    this.applyFocus();
  }
  highlightType(label) {
    this.typeHl = label || null;
    this.applyFocus();
  }
  select(sel, { zoom = false } = {}) {
    this.sel = sel || null;
    this.applyFocus();
    if (!zoom || !sel) return;
    if (sel.kind === 'edge' && this.edges.has(sel.id)) {
      const e = this.edges.get(sel.id);
      this.userMoved();
      this.fit([e.s.uuid, e.t.uuid], 100, 1.6);
    } else if (sel.kind === 'node' && this.nodes.has(sel.id) && !this.isVisible(this.nodes.get(sel.id))) {
      this.centerOn(sel.id);
    }
  }
  has(kind, id) { return kind === 'edge' ? this.edges.has(id) : this.nodes.has(id); }
  edgeData(id) { const e = this.edges.get(id); return e ? e.data : null; }
  applyFocus() {
    let fn = null;
    let fe = null;
    const selNodes = new Set();
    let selEdge = null;
    const sel = this.sel;
    if (sel && sel.kind === 'node' && this.nodes.has(sel.id)) {
      fn = new Set([sel.id]);
      fe = new Set();
      selNodes.add(sel.id);
      for (const e of this.edges.values()) {
        if (e.s.uuid === sel.id || e.t.uuid === sel.id) {
          fe.add(e.uuid);
          fn.add(e.s.uuid);
          fn.add(e.t.uuid);
        }
      }
    } else if (sel && sel.kind === 'edge' && this.edges.has(sel.id)) {
      selEdge = this.edges.get(sel.id);
      fe = new Set([sel.id]);
      fn = new Set([selEdge.s.uuid, selEdge.t.uuid]);
      selNodes.add(selEdge.s.uuid);
      selNodes.add(selEdge.t.uuid);
    } else if (this.hl) {
      fn = new Set();
      fe = new Set();
      for (const id of this.hl) {
        const e = this.edges.get(id);
        if (e) {
          fe.add(id);
          fn.add(e.s.uuid);
          fn.add(e.t.uuid);
        } else if (this.nodes.has(id)) fn.add(id);
      }
      if (!fn.size && !fe.size) { fn = null; fe = null; }
    } else if (this.typeHl) {
      fn = new Set();
      fe = new Set();
      for (const n of this.nodes.values()) if (n.label === this.typeHl) fn.add(n.uuid);
      for (const e of this.edges.values()) if (fn.has(e.s.uuid) || fn.has(e.t.uuid)) fe.add(e.uuid);
    }
    for (const n of this.nodes.values()) {
      const inF = !fn || fn.has(n.uuid);
      n.g.classList.toggle('dim', !inF);
      n.lab.classList.toggle('dim', !inF);
      n.lab.classList.toggle('hl', !!fn && inF);
      n.g.classList.toggle('sel', selNodes.has(n.uuid));
    }
    for (const e of this.edges.values()) {
      const inF = !fe || fe.has(e.uuid);
      e.path.classList.toggle('dim', !inF);
      e.pill.classList.toggle('dim', !inF);
      e.pill.classList.toggle('hl', !!fe && inF);
      const isSel = e === selEdge;
      e.path.classList.toggle('selected', isSel);
      e.pill.classList.toggle('selected', isSel);
      e.path.setAttribute('marker-end', `url(#${this.markerId(isSel ? 'sel' : e.state)})`);
    }
    if (selEdge) {
      // draw the selected edge above its neighbours
      this.gEdges.append(selEdge.path);
      this.gPills.append(selEdge.pill);
    }
  }

  /* ---- view transform ---- */
  applyTransform() {
    this.vp.setAttribute('transform', `translate(${r1(this.tx)},${r1(this.ty)}) scale(${Math.round(this.k * 1000) / 1000})`);
    const zoomed = this.k >= G.LABEL_ZOOM;
    this.svg.classList.toggle('nl-auto', this.nodes.size > G.NODE_LABELS_MAX && !zoomed);
    this.svg.classList.toggle('el-auto', this.edges.size > G.EDGE_LABELS_MAX && !zoomed);
  }
  /** Width of the graph hidden behind the open detail panel. */
  rightInset() {
    const p = document.getElementById('panel');
    if (!p || !p.classList.contains('open')) return 0;
    const hr = this.host.getBoundingClientRect();
    const overlap = hr.right - (window.innerWidth - p.offsetWidth);
    return overlap > 0 && overlap < hr.width * 0.6 ? overlap : 0;
  }
  isVisible(n) {
    const x = n.x * this.k + this.tx;
    const y = n.y * this.k + this.ty;
    return x > 20 && y > 20 && x < this.w - this.rightInset() - 20 && y < this.hgt - 20;
  }
  transformTo(k, tx, ty, animate = true) {
    cancelAnimationFrame(this.anim);
    if (!animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      this.k = k;
      this.tx = tx;
      this.ty = ty;
      this.applyTransform();
      return;
    }
    const from = { k: this.k, tx: this.tx, ty: this.ty };
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / 350);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      this.k = from.k + (k - from.k) * e;
      this.tx = from.tx + (tx - from.tx) * e;
      this.ty = from.ty + (ty - from.ty) * e;
      this.applyTransform();
      if (p < 1 && !this.destroyed) this.anim = requestAnimationFrame(step);
    };
    this.anim = requestAnimationFrame(step);
  }
  fit(ids = null, pad = 40, maxK = 1.2) {
    const list = ids ? ids.map((id) => this.nodes.get(id)).filter(Boolean) : [...this.nodes.values()];
    const b = this.bbox(list);
    const availW = Math.max(120, this.w - this.rightInset());
    // keep clear of the search bar above and the zoom buttons below
    const top = G.OVERLAY_TOP;
    const bottom = G.OVERLAY_BOTTOM;
    const availH = Math.max(120, this.hgt - top - bottom);
    if (!b) {
      this.transformTo(G.ZOOM_INIT, availW / 2, top + availH / 2);
      return;
    }
    const bw = Math.max(1, b.x1 - b.x0 + 60); // room for the name labels on the right
    const bh = Math.max(1, b.y1 - b.y0);
    const k = clamp(Math.min((availW - 2 * pad) / bw, (availH - 2 * pad) / bh), G.ZOOM_MIN, maxK);
    const cx = (b.x0 + b.x1 + 60) / 2;
    const cy = (b.y0 + b.y1) / 2;
    this.transformTo(k, availW / 2 - cx * k, top + availH / 2 - cy * k);
  }
  centerOn(id) {
    const n = this.nodes.get(id);
    if (!n) return;
    this.userMoved();
    const k = Math.max(this.k, 1);
    const availW = Math.max(120, this.w - this.rightInset());
    this.transformTo(k, availW / 2 - n.x * k, this.hgt / 2 - n.y * k);
  }
  zoomBy(f) {
    this.userMoved();
    this.zoomAt(f, (this.w - this.rightInset()) / 2, this.hgt / 2, true);
  }
  /** Fit on request (button, f key). */
  fitAll() {
    this.userMoved();
    this.fit();
  }
  zoomAt(f, px, py, animate = false) {
    const k = clamp(this.k * f, G.ZOOM_MIN, G.ZOOM_MAX);
    const wx = (px - this.tx) / this.k;
    const wy = (py - this.ty) / this.k;
    this.transformTo(k, px - wx * k, py - wy * k, animate);
  }

  /* ---- interaction ---- */
  bind() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (ev) => this.onDown(ev));
    svg.addEventListener('pointermove', (ev) => this.onMove(ev));
    svg.addEventListener('pointerup', (ev) => this.onUp(ev));
    svg.addEventListener('pointercancel', (ev) => this.onUp(ev));
    svg.addEventListener('pointerleave', () => { if (!this.drag) this.hideTip(); });
    svg.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const r = svg.getBoundingClientRect();
      const dy = ev.deltaMode === 1 ? ev.deltaY * 33 : ev.deltaMode === 2 ? ev.deltaY * 400 : ev.deltaY;
      this.userMoved();
      this.zoomAt(Math.exp(-dy * (ev.ctrlKey ? 0.01 : 0.0015)), ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });
    this.host.addEventListener('keydown', (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const pan = (dx, dy) => { this.tx += dx; this.ty += dy; this.applyTransform(); };
      switch (ev.key) {
        case '+': case '=': this.zoomBy(1.25); break;
        case '-': case '_': this.zoomBy(0.8); break;
        case 'ArrowLeft': pan(40, 0); break;
        case 'ArrowRight': pan(-40, 0); break;
        case 'ArrowUp': pan(0, 40); break;
        case 'ArrowDown': pan(0, -40); break;
        default: return;
      }
      ev.preventDefault();
    });
  }
  toWorld(ev) {
    const r = this.svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left - this.tx) / this.k, y: (ev.clientY - r.top - this.ty) / this.k };
  }
  onDown(ev) {
    if (ev.button !== 0) return;
    cancelAnimationFrame(this.anim);
    const t = ev.target instanceof Element ? ev.target : null;
    const nodeEl = t && t.closest('[data-node]');
    const edgeEl = !nodeEl && t && t.closest('[data-edge]');
    const base = { sx: ev.clientX, sy: ev.clientY, moved: false };
    if (nodeEl) {
      const n = this.nodes.get(nodeEl.getAttribute('data-node'));
      if (!n) return;
      this.drag = { kind: 'node', n, ...base };
    } else if (edgeEl) this.drag = { kind: 'edge', id: edgeEl.getAttribute('data-edge'), ...base };
    else this.drag = { kind: 'pan', tx: this.tx, ty: this.ty, ...base };
    try { this.svg.setPointerCapture(ev.pointerId); } catch { /* ignore */ }
    this.hideTip();
    this.host.focus({ preventScroll: true });
    ev.preventDefault();
  }
  onMove(ev) {
    const d = this.drag;
    if (!d) { this.hover(ev); return; }
    const dx = ev.clientX - d.sx;
    const dy = ev.clientY - d.sy;
    if (!d.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 4) return;
      d.moved = true;
      this.svg.classList.add('dragging');
      if (d.kind === 'node') {
        this.sim.anchored = false;
        for (const n of this.nodes.values()) { n.ax = null; n.ay = null; }
      }
    }
    if (d.kind === 'pan') {
      this.userMoved();
      this.tx = d.tx + dx;
      this.ty = d.ty + dy;
      this.applyTransform();
    } else if (d.kind === 'node') {
      const p = this.toWorld(ev);
      d.n.fx = p.x;
      d.n.fy = p.y;
      d.n.x = p.x;
      d.n.y = p.y;
      if (this.sim.alpha < G.DRAG_ALPHA) this.sim.alpha = G.DRAG_ALPHA;
      this.start();
    }
  }
  onUp(ev) {
    const d = this.drag;
    this.drag = null;
    this.svg.classList.remove('dragging');
    try { this.svg.releasePointerCapture(ev.pointerId); } catch { /* ignore */ }
    if (!d) return;
    if (d.kind === 'node') {
      d.n.fx = null;
      d.n.fy = null;
      if (d.moved) {
        this.sim.alpha = Math.max(this.sim.alpha, G.DRAG_ALPHA);
        this.start();
      } else if (ev.type === 'pointerup' && this.on.node) this.on.node(d.n.uuid);
      return;
    }
    if (d.moved || ev.type !== 'pointerup') return;
    if (d.kind === 'edge' && this.on.edge) this.on.edge(d.id);
    else if (d.kind === 'pan' && this.on.background) this.on.background();
  }
  hover(ev) {
    const t = ev.target instanceof Element ? ev.target : null;
    const nodeEl = t && t.closest('[data-node]');
    const edgeEl = !nodeEl && t && t.closest('[data-edge]');
    if (nodeEl) {
      const n = this.nodes.get(nodeEl.getAttribute('data-node'));
      if (n) return this.showTip(ev, [h('div', null, h('strong', null, String(n.data.name ?? ''))), h('div', { class: 'tip-sub' }, n.label)]);
    } else if (edgeEl) {
      const e = this.edges.get(edgeEl.getAttribute('data-edge'));
      if (e) return this.showTip(ev, [h('div', null, String(e.data.fact ?? '')), h('div', { class: 'tip-sub' }, `${e.data.relation ?? ''} · ${e.state}`)]);
    }
    this.hideTip();
  }
  showTip(ev, content) {
    const tip = this.tip;
    tip.replaceChildren(...content);
    tip.hidden = false;
    const r = this.host.getBoundingClientRect();
    let x = ev.clientX - r.left + 14;
    let y = ev.clientY - r.top + 14;
    if (x + tip.offsetWidth > r.width - 8) x = ev.clientX - r.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > r.height - 8) y = ev.clientY - r.top - tip.offsetHeight - 14;
    tip.style.transform = `translate(${Math.max(4, x)}px, ${Math.max(4, y)}px)`;
  }
  hideTip() { this.tip.hidden = true; }
  destroy() {
    this.destroyed = true;
    cancelAnimationFrame(this.raf);
    cancelAnimationFrame(this.anim);
    if (this.ro) this.ro.disconnect();
    this.svg.remove();
    this.tip.remove();
  }
}

/* ---------------------------------------------------------------- 8. views */
/*
 * A view is a function (root) => api, where api may implement:
 * destroy, reload, onTime (default reload), onSel, onQuery, onMeta,
 * onHighlight, onData (default reload), fit, focusSearch, focusNode.
 */

/** After a memory was processed or a fact corrected: refresh what is on screen. */
function emitData(group) {
  const a = mounted && mounted.api;
  if (a && (group === undefined || group === state.group || state.view === 'groups')) {
    if (a.onData) a.onData();
    else if (a.reload) a.reload();
  }
  if (panelCur && (group === undefined || group === state.group)) syncPanel(true);
  if (group !== undefined && group !== state.group) state.groupsList = null;
  refreshStatus();
}
async function retryFailed(btn) {
  if (btn) btn.disabled = true;
  toast(S.retrying);
  try {
    const r = await api('POST', '/episodes/retry-failed', {});
    toast(S.retried(r), r.still_failing ? 'error' : 'ok');
    emitData(state.group);
  } catch { /* toast shown */ } finally {
    if (btn) btn.disabled = false;
  }
}

/* ---- 8.1 groups list -------------------------------------------------- */
function GroupsView(root) {
  const ctl = new AbortController();
  const input = h('input', { class: 'input', placeholder: S.openGroupPh, 'aria-label': S.openGroup });
  const form = h('form', null, input, h('button', { class: 'btn', type: 'submit' }, S.open));
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const v = input.value.trim();
    if (v) go('graph', v);
  });
  const body = h('div', null, h('div', { class: 'card' }, skeletonRows(5)));
  root.append(h('div', { class: 'page-head' }, h('div', null, h('h1', null, S.groups), h('p', { class: 'muted small' }, S.groupsSub)), form), body);
  async function load() {
    try {
      const r = await api('GET', '/groups', { group: null, signal: ctl.signal, quiet: true });
      state.groupsList = r;
      const groups = arr(r.groups);
      const def = r.default_group || 'default';
      if (!groups.length) {
        body.replaceChildren(h('div', { class: 'card' }, emptyState({
          title: S.noMemory, text: S.noMemoryText,

        })));

      }
      const last = (g) => ms(g.last_episode_at);
      // rows carry the caller's role in each group (servers with users and roles)
      const roles = groups.some((g) => g && g.role);
      body.replaceChildren(dataTable({
        label: S.groups,
        rows: groups,
        sort: { key: 'last', dir: 'desc' },
        onRow: (g) => go('graph', g.group_id),
        columns: [
          { key: 'group', label: S.colGroup, sortValue: (g) => String(g.group_id).toLowerCase(),
            render: (g) => h('span', { class: 'row' }, h('strong', null, g.group_id), g.group_id === def ? pill(S.defaultTag) : null) },
          roles ? { key: 'role', label: S.colYourRole, firstDir: 'desc', sortValue: (g) => rank(g.role), render: (g) => roleBadge(g.role) } : null,
          { key: 'entities', label: S.colEntities, cls: 'num', firstDir: 'desc', sortValue: (g) => g.entities ?? 0, render: (g) => num(g.entities) },
          { key: 'facts', label: S.colFacts, cls: 'num', firstDir: 'desc', sortValue: (g) => g.facts ?? 0, render: (g) => `${num(g.active_facts)} / ${num(g.facts)}` },
          { key: 'episodes', label: S.colEpisodes, cls: 'num', firstDir: 'desc', sortValue: (g) => g.episodes ?? 0, render: (g) => num(g.episodes) },
          { key: 'failed', label: S.colFailed, cls: 'num', firstDir: 'desc', sortValue: (g) => g.failed_episodes ?? 0,
            render: (g) => (g.failed_episodes > 0 ? badge(num(g.failed_episodes), 'red') : h('span', { class: 'muted' }, '0')) },
          { key: 'last', label: S.colLast, cls: 'nowrap', firstDir: 'desc', sortValue: last,
            render: (g) => h('span', { title: last(g) === null ? null : fmtDateTime(last(g)) }, relTime(last(g))) },
        ].filter(Boolean),
      }));
    } catch (e) {
      if (isAbort(e)) return;
      body.replaceChildren(h('div', { class: 'card' }, e.status === 404 ? emptyState({ title: S.groupsUnavailable, text: S.openGroupPh }) : errorState(e, load)));
    }
  }
  load();
  return { destroy: () => ctl.abort(), reload: load, focusSearch: () => input.focus() };
}

/* ---- 8.2 graph ---------------------------------------------------------- */
function GraphPage(root) {
  root.classList.add('fill');
  let destroyed = false;
  let data = null;
  let loadCtl = null;
  let statsTimer = 0;
  let statsSig = '';
  let firstData = true;
  const stats = h('section', { class: 'stats', 'aria-label': S.statFacts });
  const card = h('section', { class: 'graph-card', 'aria-label': S.graphLabel });
  const host = h('div', { class: 'graph-host', tabindex: '0', role: 'group', 'aria-label': S.graphAria });
  card.append(host);
  root.append(stats, card);
  stats.append(...[S.statEntities, S.statFacts, S.statEpisodes, S.statJobs].map((t) => statCard(t, h('span', { class: 'skel', style: { display: 'block', width: '40%', height: '20px' } }), ' ')));

  const gv = new GraphView(host, {
    node: (id) => select('node', id),
    edge: (id) => {
      select('edge', id, gv.edgeData(id));
      gv.select(state.sel, { zoom: true });
    },
    background: () => {
      // first click folds the search results away so the highlighted graph is visible
      if (!sResults.hidden) sResults.hidden = true;
      else if (state.sel) setState({ sel: null });
      else if (state.highlight.size) clearHighlight();

  });

  /* legend (top-left) */
  let legendOpen = true;
  let typeActive = null;
  const legendList = h('ul', { class: 'legend-list' });
